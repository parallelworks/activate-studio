<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" />
    <!-- use-credentials: a manifest is fetched without cookies by default,
         and behind the platform's session proxy that is a sign-in redirect. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f3f4f6" />
    <title>Studio</title>
    <script>
      // Paint in the right theme immediately. Everything below is a cache of
      // what the app applied last time; the app still fetches the real
      // configuration and overwrites these, but without this the first paint
      // uses stock light-mode defaults and visibly flips once config lands.
      try {
        var d = document.documentElement
        var t = localStorage.getItem('ade-theme') || localStorage.getItem('ade-theme-default')
        if (t === 'dark' || t === 'light') {
          d.dataset.theme = t
          d.classList.toggle('dark', t === 'dark')
          d.style.colorScheme = t
        }
        var put = function (id, css) {
          if (!css) return
          var el = document.createElement('style')
          el.id = id
          el.textContent = css
          document.head.appendChild(el)
        }
        put('accent-style', localStorage.getItem('ade-accent-css'))
        var tc = localStorage.getItem('ade-theme-color')
        var tm = document.querySelector('meta[name="theme-color"]')
        if (tc && tm) tm.setAttribute('content', tc)
        put('surface-style', localStorage.getItem('ade-surface-css'))
      } catch (e) { /* first visit, or storage unavailable */ }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced when the app mounts. On a slow link the bundle can take
           several seconds, and a blank page reads as a broken deployment. -->
      <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#64748b">
        <div style="text-align:center">
          <div style="width:26px;height:26px;margin:0 auto 12px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:boot-spin 0.9s linear infinite"></div>
          <div style="font-size:13px">Starting the studio…</div>
        </div>
      </div>
      <style>@keyframes boot-spin{to{transform:rotate(360deg)}}</style>
      <!-- The classification banner as the app last drew it, so the loading
           screen carries the marking too. In an installed app the banner is
           the title bar; without this the strip between the window controls
           shows the page's ground until the app mounts. -->
      <div id="boot-bar" role="note" hidden></div>
      <style>
        #boot-bar{position:fixed;top:0;left:0;right:0;z-index:1;text-align:center;font:400 0.8rem system-ui,sans-serif;padding:3px 0;-webkit-font-smoothing:antialiased}
        #boot-bar[hidden]{display:none!important}
        @media (display-mode: window-controls-overlay){#boot-bar{display:flex;align-items:center;justify-content:center;box-sizing:border-box;height:env(titlebar-area-height,33px);padding:0 max(env(titlebar-area-x,0px),calc(100vw - env(titlebar-area-x,0px) - env(titlebar-area-width,100vw)));overflow:hidden;line-height:1.15;app-region:drag;-webkit-app-region:drag;user-select:none}}
      </style>
      <script>
        try {
          var b = JSON.parse(localStorage.getItem('ade-banner') || 'null')
          var embedded = true
          try { embedded = window.self !== window.top } catch (e) { /* cross-origin parent */ }
          if (b && b.text && (!embedded || b.whenEmbedded)) {
            var bar = document.getElementById('boot-bar')
            bar.textContent = b.text
            bar.title = b.text
            bar.style.background = b.color
            bar.style.color = b.ink
            bar.hidden = false
          }
        } catch (e) { /* first visit, or storage unavailable */ }
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
