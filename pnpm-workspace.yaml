packages:
  - server
  - web
allowBuilds:
  esbuild: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@parallelworks/*'
  # Authored in-house as well; new releases are consumed the day they ship.
  - '@giraffesyo/*'
engineStrict: true
# Floors for transitive packages with published advisories, held within
# the major version their dependents ask for.
overrides:
  fast-uri@3: ^3.1.9
  fast-uri@4: ^4.2.3
  js-yaml@4: ^4.3.2
  dompurify@3: ^3.4.17
  brace-expansion@5: ^5.0.12
  source-map-js@1: ^1.2.2
  '@fastify/busboy@3': ^3.2.2
  # The one exception to "within the major": dependents ask for ^0.16 and
  # no 0.16.x carries the prototype-pollution fix (GHSA-238p-pmpm-9mq7).
  katex@<0.18.2: ^0.18.2
# Escape stops a chat reply only while the chat is on screen. The fix goes
# upstream to @parallelworks/ui; drop this patch on the release that has it.
patchedDependencies:
  '@parallelworks/ui@0.120.0': patches/@parallelworks__ui@0.120.0.patch
