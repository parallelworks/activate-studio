packages:
  - server
  - web
allowBuilds:
  esbuild: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@parallelworks/*'
  # Authored in-house as well; new releases are consumed the day they ship.
  - '@giraffesyo/*'
engineStrict: true
# Floors for transitive packages with published advisories, held within
# the major version their dependents ask for.
overrides:
  fast-uri@3: ^3.1.9
  fast-uri@4: ^4.2.3
  js-yaml@4: ^4.3.2
  dompurify@3: ^3.4.17
  brace-expansion@5: ^5.0.12
  source-map-js@1: ^1.2.2
  '@fastify/busboy@3': ^3.2.2
  # The one exception to "within the major": dependents ask for ^0.16 and
  # no 0.16.x carries the prototype-pollution fix (GHSA-238p-pmpm-9mq7).
  katex@<0.18.2: ^0.18.2
# parallelworks/foundation#842: in WebKit a transcript at its latest turn keeps
# following through a send and an answered approval. It is in @parallelworks/ui
# after 0.151.1; drop that part on the release that has it.
# Streams kept by chat: in ChatProvider, useSSEStream and ChatMessageList, a
# reply, its Stop and its queued messages belong to the chat they were sent in,
# and a host's own session is not drawn with the provider's stream. No release
# has it yet; keep those parts until one does (test/chatCrossTalk.test.tsx).
# That is parallelworks/foundation#843.
# Find while away: in ChatMessageList and TranscriptFind, rows of a hidden list
# are not read for find, which kept them as empty. No release has it yet; keep
# those parts until one does (test/findWhileAway.test.tsx).
patchedDependencies:
  '@parallelworks/ui@0.151.1': patches/@parallelworks__ui@0.151.1.patch
