# Build the Linux x86_64 payload of ACTIVATE Studio, the equivalent of the
# macOS app's contents without a window or a package: a relocatable
# directory tree (Node, Python with its packages, GUFI with its AI pieces
# and the models, tesseract, the built server and web app, the document
# converter's Linux binary) in activate-studio-linux-x86_64.tar.gz, with a
# manifest and a SHA-256. See docs/LINUX-APP.md.
#
# GUFI and tesseract are built from source in a Rocky Linux 9 container
# (glibc 2.34, the oldest target), so one payload runs on Ubuntu 22.04 and
# later and on RHEL 9 and later; build_app.sh then checks that no file in
# the tree needs a newer glibc. The archive is unpacked in clean Ubuntu
# 22.04, Ubuntu 24.04 and Rocky Linux 9 containers and run there as a plain
# user: indexing, search, Query, search by meaning, OCR, document
# conversion and the update check.
#
# Nothing publishes unless a run is started by hand with the release input,
# as for mac-app: the archive is otherwise a workflow artifact for 30 days.
# Asked to for a published release (the release input), the run builds that
# tag, checks it in the same containers, signs the update manifest with the
# release key, and attaches the archive, the manifest and its signature to
# the release, so per-user installs can update to it; and it puts the same
# files in the linux release, the fixed address the installer and the docs
# use (a prerelease that is never latest, as macos is). Releases are
# frequent and most do not get a Linux build; an install updates to the
# newest release that has one. An install from a .deb or .rpm package does
# not update itself (docs/LINUX-APP.md).
name: linux-app

on:
  push:
    branches: [linux-app]
  workflow_dispatch:
    inputs:
      release:
        description: A published release (such as v1.150) to build the payload for and attach it to; blank to build and check only
        default: ""

permissions: {}

concurrency:
  group: linux-app-${{ inputs.release || github.ref }}
  cancel-in-progress: true

env:
  # Base images for the build and the tests. Tags, not digests: the point of
  # the test jobs is to run on what a person has today.
  BUILD_IMAGE: rockylinux:9

jobs:
  # GUFI (with sqlite-vec and sqlite-lembed) and tesseract, built in a
  # Rocky 9 container. They do not depend on each other, so they build side
  # by side.
  native:
    strategy:
      fail-fast: false
      matrix:
        component: [gufi, ocr]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "release must look like v1.150, not '$RELEASE'"; exit 1; }
          gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" --json tagName >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release }}
      - name: build ${{ matrix.component }} in Rocky Linux 9
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/cache"
          start=$(date +%s)
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/out:/out" -v "$RUNNER_TEMP/cache:/cache" \
            -e OUT_DIR=/out -e CACHE_DIR=/cache -e "JOBS=$(nproc)" "$BUILD_IMAGE" bash "/src/deploy/linux/build_$COMPONENT.sh"
          echo "build_$COMPONENT took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.component }}
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  # The payload: the server and web app built here, the pinned Node and
  # Python, and the two archives above, put together and checked.
  app:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe names the build; a release builds at its own tag.
          fetch-depth: 0
          ref: ${{ inputs.release }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # No cache: this job's output is what a release would ship.
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: build the payload
        env:
          OUT_DIR: ${{ runner.temp }}/out
          CACHE_DIR: ${{ runner.temp }}/cache
          SKIP_BUILD: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends patchelf libatomic1
          (cd "$RUNNER_TEMP/native" && sha256sum -c gufi-linux-x86_64.tar.gz.sha256 ocr-linux-x86_64.tar.gz.sha256)
          start=$(date +%s)
          GUFI_TARBALL="$RUNNER_TEMP/native/gufi-linux-x86_64.tar.gz" OCR_TARBALL="$RUNNER_TEMP/native/ocr-linux-x86_64.tar.gz" \
            deploy/linux/build_app.sh 2>&1 | tee "$RUNNER_TEMP/build_app.log"
          {
            echo "### Payload"
            echo "build_app took $(( $(date +%s) - start )) s (the web and server build and the downloads included)"
            echo '```'
            ls -l "$OUT_DIR"/activate-studio-linux-x86_64.*
            du -sh "$OUT_DIR/activate-studio"
            echo '```'
            sed -n '/^Size$/,/^$/p' "$RUNNER_TEMP/build_app.log" | head -n 12
            echo '```'
            cat "$OUT_DIR/activate-studio-linux-x86_64.manifest.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activate-studio-linux-x86_64
          path: |
            ${{ runner.temp }}/out/activate-studio-linux-x86_64.tar.gz
            ${{ runner.temp }}/out/activate-studio-linux-x86_64.tar.gz.sha256
            ${{ runner.temp }}/out/activate-studio-linux-x86_64.manifest.json
          if-no-files-found: error
          retention-days: 30

  # The payload unpacked in a clean container of each target distribution
  # and run as a plain user, on the image's own packages plus only the ones
  # in extra_packages (which the log records).
  test:
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            extra_packages: ""
          - image: ubuntu:24.04
            extra_packages: ""
          # Docker's official rockylinux:9 image is an old point release
          # (9.3); the other two are current 9.x releases of the two
          # rebuilds the Linux app targets.
          - image: rockylinux:9
            extra_packages: ""
          - image: rockylinux/rockylinux:9
            extra_packages: ""
          - image: almalinux:9
            extra_packages: ""
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activate-studio-linux-x86_64
          path: ${{ runner.temp }}/in
      - name: run it in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          EXTRA_PACKAGES: ${{ matrix.extra_packages }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/in" && sha256sum -c activate-studio-linux-x86_64.tar.gz.sha256)
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/in:/in:ro" -e EXTRA_PACKAGES \
            "$IMAGE" bash /src/deploy/linux/test_in_container.sh 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: summary
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          {
            echo "### $IMAGE"
            echo '```'
            sed -n '/^Image:/,/^Payload manifest/p' "$RUNNER_TEMP/test.log" | head -n 8
            grep -E '^  (ok|FAIL|note) ' "$RUNNER_TEMP/test.log" | sed 's/^  //' | cut -c1-200
            sed -n '/^Dependencies/,$p' "$RUNNER_TEMP/test.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-log-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test.log
          retention-days: 30

  # Sign the update manifest and attach to the release. The only job that
  # can write, and the only one that sees the update signing key; it runs
  # no build code, and only after every distribution passed.
  release:
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.release != ''
      && needs.app.result == 'success' && needs.test.result == 'success'
    needs: [app, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/linux/sign_release.sh
            deploy/mac/update-signing.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activate-studio-linux-x86_64
          path: ${{ runner.temp }}/out
      - name: sign the update manifest
        env:
          STUDIO_UPDATE_SIGNING_KEY: ${{ secrets.STUDIO_UPDATE_SIGNING_KEY }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "release must look like v1.150, not '$TAG'"; exit 1; }
          (cd "$RUNNER_TEMP/out" && sha256sum -c activate-studio-linux-x86_64.tar.gz.sha256)
          deploy/linux/sign_release.sh "$RUNNER_TEMP/out/activate-studio-linux-x86_64.tar.gz" "$TAG"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          files=(activate-studio-linux-x86_64.tar.gz activate-studio-linux-x86_64.tar.gz.sha256
            activate-studio-linux-x86_64.manifest.json activate-studio-linux-x86_64.manifest.json.sig)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          # The linux release holds the newest payload at a fixed address: a
          # prerelease that is never latest, which the app's update check
          # skips (its tag is not a version). An older version than the one
          # there leaves it alone.
          if gh release view linux -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            have="$(gh release download linux -R "$GITHUB_REPOSITORY" -p activate-studio-linux-x86_64.manifest.json -O - 2>/dev/null |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)"
            if [ -n "$have" ] && [ "$(printf '%s\n%s\n' "${have#v}" "${TAG#v}" | sort -V | tail -n 1)" != "${TAG#v}" ]; then
              echo "The linux release has $have, newer than $TAG; left as it is."
              exit 0
            fi
          else
            gh release create linux -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "ACTIVATE Studio for Linux" --notes "The newest Linux app."
          fi
          gh release upload linux -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release edit linux -R "$GITHUB_REPOSITORY" --notes "ACTIVATE Studio $TAG for Linux, x86_64, glibc 2.34 or later (Ubuntu 22.04, RHEL 9 and later).

          A copy installed in a user's home folder updates itself from the release for its version. A copy installed from a .deb or .rpm package is updated through apt or dnf.

          Changes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG and the releases before it."
