# Build the macOS app on a Mac, where its window is compiled and the .dmg is
# made, and run the checks only a Mac can: the bundled server, GUFI and
# tesseract, the server from the app's run loop, and the launcher with its
# LaunchAgent. The app is the Go version (deploy/mac/build_app.sh's default,
# STUDIO_SERVER=go-only): the Wails window (desktop/wails) and the Go
# server, with no Node and no Python. It is the build releases ship, and it
# is updated to from earlier releases (Node) through their own updaters
# (the bridge job: v1.169 and v1.188 on every check run, more with the
# bridge input). A copy of the app is also
# signed the way a release signs it, with a throwaway identity, and run (the
# hardened job). Asked to for a published release (the release input), it
# builds that tag; signs, notarizes and staples the app with the Developer ID
# certificate when the repository has the signing secrets (the sign job;
# without them the app stays signed ad hoc); signs the update manifest; and
# attaches the app to the release, so installed copies can update to it;
# and it puts the same files in the macos release, the fixed address the
# installer and the docs use. Releases are frequent and most do not get a
# macOS build; the app updates to the newest release that has one.
#
# GUFI comes from, in order: the gufi_run input (a gufi-macos run whose
# archive to use, to try a new GUFI build), GUFI_RUN below (the same, for
# runs without inputs; a run's archive expires after 30 days), the
# GUFI_RELEASE tag below (the published archive, built for macOS 14 by
# gufi-macos.yml; see docs/GUFI-MACOS.md), else GUFI's own package, which
# needs macOS 27; with that one the run checks are skipped on older runners.
#
# OCR (tesseract and leptonica, with the English model) is built from
# source for macOS 14 on each run, by deploy/mac/build_ocr.sh.
#
# The app is built for Apple silicon (arm64, on macos-15) and for Intel
# (x86_64, on macos-15-intel). The Intel build takes GUFI from the same
# places when they have a gufi-macos-x86_64 archive, and otherwise builds
# the lean GUFI (build_gufi.sh, GUFI_LEMBED=0) in the job. The bridge job
# updates from earlier releases, which were Apple silicon only.
name: mac-app

on:
  workflow_dispatch:
    inputs:
      release:
        description: A published release (such as v1.150) to build the app for and attach it to; blank to build and check only
        default: ""
      channel:
        description: For a release, the channel its manifest is signed for (stable, or preview for a prerelease that only Preview installs take; a preview release leaves the fixed macos release alone)
        default: stable
      gufi_run:
        description: A gufi-macos run id whose GUFI archive to use
        default: ""
      gufi_vec_run:
        description: A gufi-macos run id made with lembed off (the lean GUFI) for the Go version; blank for the GUFI above
        default: ""
      legacy:
        description: Also build and check the earlier builds (STUDIO_SERVER=node, and go with Node behind it); they do not fail the run
        type: boolean
        default: false
      bridge:
        description: The releases the bridge job updates from (check, v1.169 with its LaunchAgent and v1.188 detached; all, v1.141 to v1.188 and each way of starting in the bridge job's list)
        type: choice
        options: [check, all]
        default: check
  # A change to the app or its build is built and checked on a Mac, and so
  # is a change to the Go server or the window, which check_app.sh runs from
  # the app (indexing, search, Query, libraries over ssh). The web client is
  # only bundled, not exercised there, so it is left to CI.
  pull_request:
    paths:
      - deploy/mac/**
      - deploy/common/**
      - server-go/**
      - desktop/wails/**
      - .github/workflows/mac-app.yml

permissions: {}

env:
  # A gufi-macos run whose archive the app uses, ahead of the release, to try
  # a new GUFI build (a run's archive expires after 30 days). Empty for a
  # release.
  GUFI_RUN: ""
  # The gufi-* release whose gufi-macos-<arch>.tar.gz the app uses.
  GUFI_RELEASE: gufi-021a717-macos14

concurrency:
  group: mac-app-${{ inputs.release || github.ref }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      ARCH: ${{ matrix.arch }}
      ASSET: activate-studio-macos-${{ matrix.arch }}
    steps:
      - name: the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "release must look like v1.150, not '$RELEASE'"; exit 1; }
          gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" --json tagName >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # git describe names the build; a release builds at its own tag.
          fetch-depth: 0
          ref: ${{ inputs.release }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # No cache: this job's output is what releases ship.
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server-go/go.mod
          # No cache: this job's output is what releases ship.
          cache: false

      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: GUFI
        env:
          GH_TOKEN: ${{ github.token }}
          GUFI_RUN_INPUT: ${{ inputs.gufi_vec_run || inputs.gufi_run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gufi"
          run="${GUFI_RUN_INPUT:-$GUFI_RUN}"
          gufi="gufi-macos-$ARCH.tar.gz"
          # An Intel build goes on without one: it builds GUFI below.
          if [ -n "$run" ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n "gufi-macos-$ARCH" -D "$RUNNER_TEMP/gufi" || [ "$ARCH" != arm64 ]
          elif [ -n "$GUFI_RELEASE" ]; then
            gh release download "$GUFI_RELEASE" -R "$GITHUB_REPOSITORY" -p "$gufi*" -D "$RUNNER_TEMP/gufi" || [ "$ARCH" != arm64 ]
          fi
          if [ ! -f "$RUNNER_TEMP/gufi/$gufi" ] && [ "$ARCH" != arm64 ]; then
            echo "No $gufi: building the lean GUFI here (build_gufi.sh, GUFI_LEMBED=0)."
            GUFI_LEMBED=0 OUT_DIR="$RUNNER_TEMP/gufi" deploy/mac/build_gufi.sh
            gufi="gufi-vec-macos-$ARCH.tar.gz"
          fi
          if [ -f "$RUNNER_TEMP/gufi/$gufi" ]; then
            (cd "$RUNNER_TEMP/gufi" && shasum -a 256 -c "$gufi.sha256")
            echo "GUFI_TARBALL=$RUNNER_TEMP/gufi/$gufi" >> "$GITHUB_ENV"
          else
            echo "No GUFI archive: the app uses GUFI's own macOS package."
          fi

      - name: OCR
        env:
          # The sources' fallback through the release API (deploy/common/lib.sh),
          # which refuses a runner without a token once its rate limit is spent.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/ocr" deploy/mac/build_ocr.sh
          echo "OCR_TARBALL=$RUNNER_TEMP/ocr/ocr-macos-$ARCH.tar.gz" >> "$GITHUB_ENV"

      - name: build the app
        env:
          SKIP_BUILD: "1"
          OUT_DIR: ${{ runner.temp }}/out
        run: |
          set -euo pipefail
          deploy/mac/build_app.sh 2>&1 | tee "$RUNNER_TEMP/build_app.log"
          {
            echo "### The app"
            echo '```'
            ls -l "$OUT_DIR/$ASSET".*
            du -sh "$OUT_DIR/ACTIVATE Studio.app"
            echo '```'
            sed -n '/^Size$/,/^$/p' "$RUNNER_TEMP/build_app.log" | head -n 14
          } >>"$GITHUB_STEP_SUMMARY"

      - name: the Wails window's tests
        working-directory: desktop/wails
        run: go test -p 4 ./...

      # On a runner older than the app's minimum macOS, static checks only.
      - name: check it on this Mac
        env:
          OUT_DIR: ${{ runner.temp }}/out
        run: deploy/mac/check_app.sh "$OUT_DIR/ACTIVATE Studio.app" --run --launch --dmg "$OUT_DIR/$ASSET.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ runner.temp }}/out/${{ env.ASSET }}.tar.gz
            ${{ runner.temp }}/out/${{ env.ASSET }}.tar.gz.sha256
            ${{ runner.temp }}/out/${{ env.ASSET }}.dmg
            ${{ runner.temp }}/out/install.sh
          if-no-files-found: error
          retention-days: 30

  # The earlier builds, on request (the legacy input): Node with the Swift
  # window (STUDIO_SERVER=node, the build of v1.188 and earlier), and the Go
  # server with Node behind it (go). Kept buildable for a fallback; they do
  # not fail the run and publish nothing.
  build-legacy:
    if: inputs.release == '' && inputs.legacy
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        server: [node, go]
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server-go/go.mod
          cache: false
      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: GUFI
        env:
          GH_TOKEN: ${{ github.token }}
          GUFI_RUN_INPUT: ${{ inputs.gufi_run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gufi"
          run="${GUFI_RUN_INPUT:-$GUFI_RUN}"
          if [ -n "$run" ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n gufi-macos-arm64 -D "$RUNNER_TEMP/gufi"
          else
            gh release download "$GUFI_RELEASE" -R "$GITHUB_REPOSITORY" -p 'gufi-macos-arm64.tar.gz*' -D "$RUNNER_TEMP/gufi"
          fi
          (cd "$RUNNER_TEMP/gufi" && shasum -a 256 -c gufi-macos-arm64.tar.gz.sha256)
          echo "GUFI_TARBALL=$RUNNER_TEMP/gufi/gufi-macos-arm64.tar.gz" >> "$GITHUB_ENV"
      - name: OCR
        env:
          # The sources' fallback through the release API (deploy/common/lib.sh),
          # which refuses a runner without a token once its rate limit is spent.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/ocr" deploy/mac/build_ocr.sh
          echo "OCR_TARBALL=$RUNNER_TEMP/ocr/ocr-macos-arm64.tar.gz" >> "$GITHUB_ENV"
      - name: build it
        env:
          SKIP_BUILD: "1"
          OUT_DIR: ${{ runner.temp }}/out
          STUDIO_SERVER: ${{ matrix.server }}
        run: |
          set -euo pipefail
          deploy/mac/build_app.sh 2>&1 | tee "$RUNNER_TEMP/build_app.log"
          {
            echo "### The earlier build for macOS ($STUDIO_SERVER)"
            echo '```'
            ls -l "$OUT_DIR"/activate-studio-macos-arm64.*
            du -sh "$OUT_DIR/ACTIVATE Studio.app"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: check it on this Mac
        env:
          OUT_DIR: ${{ runner.temp }}/out
        run: deploy/mac/check_app.sh "$OUT_DIR/ACTIVATE Studio.app" --run

  # A released app (Node and the Swift window) installed, updated to this
  # build through that release's own updater (deploy/mac/test_go_bridge_e2e.sh,
  # with a throwaway key on 127.0.0.1): first a copy whose server exits at
  # once, which the run loop puts back, then this build. It publishes
  # nothing, and does not run for a release. Each entry is a release (from,
  # downloaded from its own release assets) and how its server is started
  # (start): launcher runs that release's own launcher.sh, which loads its
  # LaunchAgent (an update then restarts it with launchctl kickstart);
  # detached is the run loop launcher.sh starts where no LaunchAgent can be
  # loaded (v1.170 and later, exit 76); loop is the run loop of a release
  # before v1.170 when kickstart fails (exit 75, through the new copy's
  # stand-in node/bin/node). v1.141 is the first release with a macOS app
  # (and its updater), v1.169 the newest before v1.170. The check set runs
  # on every check run; all on request.
  bridge:
    if: inputs.release == ''
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.bridge == 'all' && '[{"from":"v1.141","start":"launcher"},{"from":"v1.169","start":"launcher"},{"from":"v1.169","start":"loop"},{"from":"v1.170","start":"launcher"},{"from":"v1.170","start":"detached"},{"from":"v1.180","start":"launcher"},{"from":"v1.180","start":"detached"},{"from":"v1.188","start":"launcher"},{"from":"v1.188","start":"detached"}]' || '[{"from":"v1.169","start":"launcher"},{"from":"v1.188","start":"detached"}]') }}
    name: bridge (${{ matrix.from }}, ${{ matrix.start }})
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: activate-studio-macos-arm64
          path: ${{ runner.temp }}/new
      - name: the old release's app
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ matrix.from }}
        run: |
          set -euo pipefail
          gh release download "$FROM" -R "$GITHUB_REPOSITORY" -p activate-studio-macos-arm64.tar.gz \
            -p activate-studio-macos-arm64.tar.gz.sha256 -D "$RUNNER_TEMP/old"
          (cd "$RUNNER_TEMP/old" && shasum -a 256 -c activate-studio-macos-arm64.tar.gz.sha256)
      - name: what launchd allows here
        if: matrix.start == 'launcher'
        run: |
          set -uo pipefail
          # A throwaway agent in the gui domain, loaded and removed, to say
          # whether this runner can run a LaunchAgent at all.
          uid="$(id -u)"
          plist="$RUNNER_TEMP/probe.plist"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict><key>Label</key><string>com.example.bridge-probe</string>' \
            '<key>ProgramArguments</key><array><string>/bin/sleep</string><string>600</string></array>' \
            '<key>RunAtLoad</key><true/></dict></plist>' >"$plist"
          {
            echo "### launchd on this runner"
            echo '```'
            echo "user $(id -un) uid $uid; console user $(stat -f %Su /dev/console)"
            launchctl print "gui/$uid" >/dev/null 2>&1 && echo "gui/$uid exists" || echo "gui/$uid: launchctl print fails"
            out="$(launchctl bootstrap "gui/$uid" "$plist" 2>&1)"; echo "bootstrap gui/$uid: status $? ${out}"
            sleep 1
            launchctl print "gui/$uid/com.example.bridge-probe" 2>&1 | grep -E '^\s*(state|pid|domain) =' || echo "the probe is not loaded"
            out="$(launchctl kickstart -k "gui/$uid/com.example.bridge-probe" 2>&1)"; echo "kickstart -k: status $? ${out}"
            launchctl bootout "gui/$uid/com.example.bridge-probe" 2>&1; echo "bootout: status $?"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: update to this build
        env:
          START: ${{ matrix.start }}
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/new" && shasum -a 256 -c activate-studio-macos-arm64.tar.gz.sha256)
          bash deploy/mac/test_go_bridge_e2e.sh "$RUNNER_TEMP/old/activate-studio-macos-arm64.tar.gz" \
            "$RUNNER_TEMP/new/activate-studio-macos-arm64.tar.gz" 2>&1 | tee "$RUNNER_TEMP/bridge.log"
      - name: summary
        if: always()
        env:
          FROM: ${{ matrix.from }}
          START: ${{ matrix.start }}
        run: |
          { echo "### Update to the Go version on macOS from $FROM ($START)"; echo '```'; grep -E '^(  (ok|FAIL|note) |[A-Z])' "$RUNNER_TEMP/bridge.log" | cut -c1-200; echo '```'; } >>"$GITHUB_STEP_SUMMARY" || true

  # The release signing, on every build but a release's: a copy of the app
  # is signed with the sign job's scripts and keychain steps, but with a
  # throwaway self-signed identity in place of the Developer ID certificate;
  # its disk image is made; and it is run. That shows a file left unsigned,
  # entitlements other than deploy/mac/entitlements names, or a signed app
  # that fails to run or that running changes. It cannot show a missing
  # entitlement: macOS treats a signature without Apple's certificate chain
  # as ad hoc, and for ad hoc code it enforces neither the hardened runtime
  # (code compiled in memory runs without its entitlement, DYLD_* variables
  # work) nor library validation. The sign job's run of the signed app shows that,
  # for a release.
  hardened:
    if: inputs.release == ''
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    name: hardened (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ASSET: activate-studio-macos-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/mac/keychain.sh
            deploy/mac/sign_app.sh
            deploy/mac/make_dmg.sh
            deploy/mac/check_app.sh
            deploy/mac/window_shots.sh
            deploy/mac/macho_check.py
            deploy/mac/install.sh
            deploy/mac/entitlements/
            deploy/mac/testdata/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/in
      - name: unpack the app
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/in" && shasum -a 256 -c "$ASSET.tar.gz.sha256")
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/in/$ASSET.tar.gz" -C "$RUNNER_TEMP/app"
      - name: sign it with a throwaway identity
        run: |
          set -euo pipefail
          id="$(deploy/mac/keychain.sh create-test "$RUNNER_TEMP/test.keychain-db")"
          deploy/mac/sign_app.sh "$RUNNER_TEMP/app/ACTIVATE Studio.app" "$id" "$RUNNER_TEMP/test.keychain-db"
          deploy/mac/make_dmg.sh "$RUNNER_TEMP/app/ACTIVATE Studio.app" "$RUNNER_TEMP/test.dmg"
      - name: run the signed app
        run: deploy/mac/check_app.sh "$RUNNER_TEMP/app/ACTIVATE Studio.app" --run --launch --dmg "$RUNNER_TEMP/test.dmg"
      # The window as a person sees it: the window controls over the page's
      # top row, in Chat, Library and Settings, light and dark, the
      # navigation expanded and collapsed, with a banner and with setup open.
      - name: screenshots of the window
        run: deploy/mac/window_shots.sh "$RUNNER_TEMP/app/ACTIVATE Studio.app" "$RUNNER_TEMP/window-shots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: window-shots${{ matrix.arch != 'arm64' && format('-{0}', matrix.arch) || '' }}
          path: ${{ runner.temp }}/window-shots
          if-no-files-found: warn
          retention-days: 14
      - name: remove the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/test.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/test.keychain-db"

  # For a release: sign the app with the Developer ID certificate, notarize
  # and staple it. The only job that sees the signing and notary secrets; it
  # cannot write to the repository and runs only the deploy/mac scripts
  # below, from the release's tag, on the app the build job made. Without
  # every secret, or for a tag from before these scripts, it signs nothing,
  # and the release carries the ad hoc app.
  sign:
    if: github.event_name == 'workflow_dispatch' && inputs.release != '' && vars.APPLE_TEAM_ID != ''
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    name: sign (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ASSET: activate-studio-macos-${{ matrix.arch }}
    # Each architecture's job writes the same value: signing needs the same
    # secrets and scripts for both.
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release }}
          sparse-checkout: |
            deploy/mac/keychain.sh
            deploy/mac/sign_app.sh
            deploy/mac/make_dmg.sh
            deploy/mac/notarize.sh
            deploy/mac/check_app.sh
            deploy/mac/macho_check.py
            deploy/mac/install.sh
            deploy/mac/entitlements/
            deploy/mac/testdata/
          sparse-checkout-cone-mode: false
      # Whether each secret is set, not its value, which stays in the
      # environment.
      - name: what signing needs
        id: ready
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=
          for name in MACOS_SIGNING_P12 MACOS_SIGNING_P12_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice title=Not notarized::The repository has no secret$missing, so the release carries the ad hoc signed app."
          elif [ ! -f deploy/mac/sign_app.sh ]; then
            echo "::notice title=Not notarized::The release's tag has no deploy/mac/sign_app.sh, so the release carries the ad hoc signed app."
          else
            echo "ready=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.ready.outputs.ready == 'true'
        with:
          name: ${{ env.ASSET }}
          path: ${{ runner.temp }}/in
      - name: unpack the app
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/in" && shasum -a 256 -c "$ASSET.tar.gz.sha256")
          mkdir -p "$RUNNER_TEMP/sign" "$RUNNER_TEMP/out"
          tar -xzf "$RUNNER_TEMP/in/$ASSET.tar.gz" -C "$RUNNER_TEMP/sign"
      # A keychain of its own, with the certificate; the identity is the
      # team's Developer ID Application certificate in it.
      - name: the signing keychain
        if: steps.ready.outputs.ready == 'true'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          deploy/mac/keychain.sh create "$kc"
          id="$(deploy/mac/keychain.sh developer-id "$kc" "$TEAM")"
          echo "SIGN_KEYCHAIN=$kc" >>"$GITHUB_ENV"
          echo "SIGN_IDENTITY=$id" >>"$GITHUB_ENV"
      - name: sign the app
        if: steps.ready.outputs.ready == 'true'
        run: deploy/mac/sign_app.sh "$RUNNER_TEMP/sign/ACTIVATE Studio.app" "$SIGN_IDENTITY" "$SIGN_KEYCHAIN"
      - name: disk image
        if: steps.ready.outputs.ready == 'true'
        run: deploy/mac/make_dmg.sh "$RUNNER_TEMP/sign/ACTIVATE Studio.app" "$RUNNER_TEMP/out/$ASSET.dmg"
      - name: notarize and staple
        if: steps.ready.outputs.ready == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: deploy/mac/notarize.sh "$RUNNER_TEMP/sign/ACTIVATE Studio.app" "$RUNNER_TEMP/out/$ASSET.dmg"
      - name: remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing.keychain-db"
      # The archive the installer and updates take, of the stapled app.
      - name: pack the stapled app
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sign"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$RUNNER_TEMP/out/$ASSET.tar.gz" "ACTIVATE Studio.app"
          cd "$RUNNER_TEMP/out"
          shasum -a 256 "$ASSET.tar.gz" >"$ASSET.tar.gz.sha256"
          cp "$RUNNER_TEMP/in/install.sh" install.sh
      # After packing: running it writes into the bundle (Python's caches).
      # With the notarized, stapled disk image where the tag's check_app.sh
      # takes one (--dmg).
      - name: run the signed app on this Mac
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          dmg=()
          if grep -q -- '--dmg FILE' deploy/mac/check_app.sh; then dmg=(--dmg "$RUNNER_TEMP/out/$ASSET.dmg"); fi
          deploy/mac/check_app.sh "$RUNNER_TEMP/sign/ACTIVATE Studio.app" --run --launch ${dmg[@]+"${dmg[@]}"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.ready.outputs.ready == 'true'
        with:
          name: ${{ env.ASSET }}-signed
          path: |
            ${{ runner.temp }}/out/${{ env.ASSET }}.tar.gz
            ${{ runner.temp }}/out/${{ env.ASSET }}.tar.gz.sha256
            ${{ runner.temp }}/out/${{ env.ASSET }}.dmg
            ${{ runner.temp }}/out/install.sh
          if-no-files-found: error
          retention-days: 30
      - name: signed
        id: signed
        if: steps.ready.outputs.ready == 'true'
        run: echo "signed=true" >>"$GITHUB_OUTPUT"

  # Sign the update manifests and attach to the release, for each
  # architecture: the notarized app when the sign job made one, otherwise
  # the build's ad hoc one. The only
  # job that can write, and the only one that sees the update signing key;
  # it runs no build code.
  release:
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.release != ''
      && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            deploy/mac/sign_release.sh
            deploy/mac/update-signing.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign.outputs.signed == 'true'
        with:
          pattern: activate-studio-macos-*-signed
          merge-multiple: true
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign.outputs.signed != 'true'
        with:
          pattern: activate-studio-macos-*
          merge-multiple: true
          path: ${{ runner.temp }}/out
      - name: sign the update manifest
        env:
          STUDIO_UPDATE_SIGNING_KEY: ${{ secrets.STUDIO_UPDATE_SIGNING_KEY }}
          TAG: ${{ inputs.release }}
          # Stable is the manifest without the field, as before channels.
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in stable) ;; preview) export STUDIO_RELEASE_CHANNEL=preview ;; *) echo "channel is stable or preview, not '$CHANNEL'"; exit 1 ;; esac
          for arch in arm64 x86_64; do
            deploy/mac/sign_release.sh "$RUNNER_TEMP/out/activate-studio-macos-$arch.tar.gz" "$TAG"
          done
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          files=(install.sh)
          for arch in arm64 x86_64; do
            a="activate-studio-macos-$arch"
            files+=("$a.tar.gz" "$a.tar.gz.sha256" "$a.manifest.json" "$a.manifest.json.sig" "$a.dmg")
          done
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          # A Preview release reaches installs that chose Preview, through
          # their updater; the fixed address new installs come from keeps
          # the newest Stable app.
          if [ "$CHANNEL" = preview ]; then
            echo "A Preview release: the macos release is left as it is."
            exit 0
          fi
          # The macos release holds the newest app at a fixed address: a
          # prerelease that is never latest, which the app's update check
          # skips (its tag is not a version). An older version than the one
          # there leaves it alone.
          if gh release view macos -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            have="$(gh release download macos -R "$GITHUB_REPOSITORY" -p activate-studio-macos-arm64.manifest.json -O - 2>/dev/null |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)"
            if [ -n "$have" ] && [ "$(printf '%s\n%s\n' "${have#v}" "${TAG#v}" | sort -V | tail -n 1)" != "${TAG#v}" ]; then
              echo "The macos release has $have, newer than $TAG; left as it is."
              exit 0
            fi
          else
            gh release create macos -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "ACTIVATE Studio for macOS" --notes "The newest macOS app."
          fi
          gh release upload macos -R "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          gh release edit macos -R "$GITHUB_REPOSITORY" --notes "ACTIVATE Studio $TAG for macOS, Apple silicon or Intel, macOS 14 or later.

          Install: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/macos/install.sh | bash\`, or open the disk image and drag the app to Applications.

          Changes: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG and the releases before it. Installed copies update themselves."
