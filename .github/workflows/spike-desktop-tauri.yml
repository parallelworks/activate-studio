# Spike: a Tauri v2 desktop shell for the Studio on Linux and Windows
# (desktop/tauri). Builds the shell and its bundles, runs its smoke test
# under Xvfb and on the Windows desktop, and uploads results, screenshots,
# binaries and installers. Runs only on the spike branch and by hand.
name: spike-desktop-tauri
on:
  push:
    branches: [spike/desktop-tauri]
  workflow_dispatch:
    inputs:
      cold:
        description: Build without the Rust cache, to time a cold build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spike-desktop-tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: system packages (WebKitGTK 4.1, Xvfb, screenshot tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file \
            xvfb imagemagick xdotool xdg-utils
          echo "webkit2gtk-4.1 $(pkg-config --modversion webkit2gtk-4.1)" | tee versions.txt
          rustc --version | tee -a versions.txt
          node --version | tee -a versions.txt

      - name: build the Studio (server and web)
        run: |
          s=$(date +%s)
          pnpm install --frozen-lockfile
          pnpm build
          echo "studio_build_seconds=$(( $(date +%s) - s ))" >> timings.txt

      - id: cache
        if: ${{ !inputs.cold }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/tauri -> target

      - name: build the shell and its bundles (deb, rpm, AppImage)
        working-directory: desktop/tauri
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          s=$(date +%s)
          npx --yes "$TAURI_CLI" build --ci --bundles deb,rpm,appimage
          echo "shell_build_seconds=$(( $(date +%s) - s ))" >> ../../timings.txt
          echo "rust_cache_hit=${{ steps.cache.outputs.cache-hit }}" >> ../../timings.txt
          cat ../../timings.txt

      - name: smoke test under Xvfb
        run: desktop/tauri/ci/smoke-linux.sh "$PWD/desktop/tauri/target/release/activate-studio-shell" "$PWD/smoke-out" "$PWD"

      - name: runtime dependencies and package checks
        if: always()
        run: |
          B=desktop/tauri/target/release
          {
            echo "## NEEDED (shell binary)"; readelf -d "$B/activate-studio-shell" | grep NEEDED
            echo "## deb Depends"; dpkg-deb -f "$B"/bundle/deb/*.deb Depends
            echo "## rpm Requires"; rpm -qpR "$B"/bundle/rpm/*.rpm 2>/dev/null || echo "(rpm tool not installed)"
            echo "## deb install"; sudo apt-get install -y "./$(ls "$B"/bundle/deb/*.deb)" 2>&1 | tail -n 3; dpkg -L activate-studio | grep -E 'bin/|\.desktop$'
          } > smoke-out/deps.txt 2>&1
          cat smoke-out/deps.txt
          cp versions.txt timings.txt smoke-out/

      - name: RHEL 9 compatible check (Rocky Linux 9 container)
        if: always()
        continue-on-error: true
        run: |
          cp desktop/tauri/target/release/bundle/appimage/*.AppImage /tmp/shell.AppImage
          docker run --rm -v /tmp/shell.AppImage:/shell.AppImage:ro rockylinux:9 bash -c '
            ldd --version | head -n 1
            echo "## WebKitGTK packages (BaseOS, AppStream, EPEL)"
            dnf -q -y install epel-release >/dev/null 2>&1
            dnf -q list --available "webkit2gtk*" "webkitgtk*" 2>&1 | grep -iE "webkit" | sort -u
            echo "## the AppImage in Rocky 9"
            cd /tmp && /shell.AppImage --appimage-extract >/dev/null 2>&1 && ls squashfs-root/usr/lib | head -n 40
            ./squashfs-root/AppRun --help 2>&1 | head -n 5
            ldd squashfs-root/usr/bin/activate-studio-shell 2>&1 | grep -E "not found|GLIBC" | head -n 20
          ' 2>&1 | tee smoke-out/rocky9.txt

      - name: report
        if: always()
        run: node desktop/tauri/ci/report.mjs desktop/tauri/target/release smoke-out

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-linux
          path: |
            smoke-out/
            desktop/tauri/target/release/activate-studio-shell
            desktop/tauri/target/release/bundle/deb/*.deb
            desktop/tauri/target/release/bundle/rpm/*.rpm
            desktop/tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: versions
        shell: pwsh
        run: |
          rustc --version | Tee-Object versions.txt
          node --version | Tee-Object -Append versions.txt
          (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv | ForEach-Object { "WebView2 runtime $_" } | Tee-Object -Append versions.txt
          [System.Environment]::OSVersion.VersionString | Tee-Object -Append versions.txt

      - name: build the Studio (server and web)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "studio_build_seconds=$([int]$sw.Elapsed.TotalSeconds)" | Add-Content timings.txt

      - id: cache
        if: ${{ !inputs.cold }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/tauri -> target

      - name: build the shell and its bundles (NSIS, MSI)
        shell: pwsh
        working-directory: desktop/tauri
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          npx --yes $env:TAURI_CLI build --ci --bundles nsis,msi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "shell_build_seconds=$([int]$sw.Elapsed.TotalSeconds)" | Add-Content ..\..\timings.txt
          "rust_cache_hit=${{ steps.cache.outputs.cache-hit }}" | Add-Content ..\..\timings.txt
          Get-Content ..\..\timings.txt

      - name: smoke test on the Windows desktop
        shell: pwsh
        run: ./desktop/tauri/ci/smoke-windows.ps1 -Bin "$PWD\desktop\tauri\target\release\activate-studio-shell.exe" -Out "$PWD\smoke-out" -Repo "$PWD"

      - name: runtime dependencies and installer check
        if: always()
        shell: pwsh
        run: |
          $B = 'desktop\tauri\target\release'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & $dumpbin.FullName /nologo /dependents "$B\activate-studio-shell.exe" | Set-Content smoke-out\deps.txt
          $nsis = Get-ChildItem "$B\bundle\nsis\*.exe" | Select-Object -First 1
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $nsis.FullName -ArgumentList '/S' -PassThru -Wait
          "## NSIS silent install: exit $($p.ExitCode) in $($sw.ElapsedMilliseconds) ms" | Add-Content smoke-out\deps.txt
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\ACTIVATE Studio" -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String | Add-Content smoke-out\deps.txt
          Get-Content smoke-out\deps.txt
          Copy-Item versions.txt, timings.txt smoke-out\

      - name: report
        if: always()
        shell: pwsh
        run: node desktop/tauri/ci/report.mjs desktop/tauri/target/release smoke-out

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-windows
          path: |
            smoke-out/
            desktop/tauri/target/release/activate-studio-shell.exe
            desktop/tauri/target/release/bundle/nsis/*.exe
            desktop/tauri/target/release/bundle/msi/*.msi

  # Can the Windows build be made on Linux? Tauri's experimental route:
  # cargo-xwin (the MSVC CRT and SDK fetched by xwin), clang/lld, and NSIS
  # (MSI needs WiX, which runs only on Windows).
  windows-from-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: tools
        run: |
          s=$(date +%s)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis lld llvm clang
          rustup target add x86_64-pc-windows-msvc
          cargo install --locked cargo-xwin
          echo "tools_seconds=$(( $(date +%s) - s ))" | tee timings.txt
      - name: build for Windows on Linux (NSIS only)
        working-directory: desktop/tauri
        run: |
          export PATH="$(dirname "$(readlink -f "$(command -v llvm-rc || ls /usr/lib/llvm-*/bin/llvm-rc | tail -n 1)")"):$PATH"
          s=$(date +%s)
          npx --yes "$TAURI_CLI" build --ci --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis
          echo "cross_build_seconds=$(( $(date +%s) - s ))" | tee -a ../../timings.txt
          ls -la target/x86_64-pc-windows-msvc/release/bundle/nsis/
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-windows-from-linux
          path: |
            timings.txt
            desktop/tauri/target/x86_64-pc-windows-msvc/release/activate-studio-shell.exe
            desktop/tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
