# Static analysis of the workflows (and dependabot.yml) for template
# injection, over-broad permissions, unpinned actions, credential leaks and
# known-vulnerable actions. Runs on every PR so it can be a required check;
# a finding fails the job and is annotated on the PR.

name: zizmor

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Annotations rather than code scanning upload: a finding should fail
      # the PR, not only appear in the Security tab.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.30.1"
          advanced-security: false
          annotations: true
