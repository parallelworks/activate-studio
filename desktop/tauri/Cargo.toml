[package]
name = "activate-studio-shell"
version = "0.1.0"
description = "ACTIVATE Studio desktop shell (Tauri v2 spike)"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
# Smaller shell binary; the shell does little work of its own.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
