# Generated by deploy/make_cfd_training_yaml.py from deploy/workflow.yaml
# plus a site preset. Every deployment value is a form default here, so a
# launch needs only the resource, account, and QOS. Site-specific paths in
# this file are deliberate: it is the copy people add from the repository
# and run as is.
#
# Regenerate after changing deploy/workflow.yaml; do not hand-edit.
# ============================================================================
# STUDIO — knowledge base workspace as an ACTIVATE session
#
# Forked from the containerized-webapp-deployment pattern (nii-ops-viewer
# lineage): the Studio's Linux app is put on the resource, its Go server is
# started over the knowledge base, which it indexes, and it is served as a
# web session through a forked pw endpoint that outlives the workflow.
# Session methods: web, e2e, cleanup.
#
# The app is the payload the Linux release ships
# (activate-studio-linux-x86_64.tar.gz, deploy/linux/build_app.sh): the Go
# server, the built web app, GUFI, tesseract, and the ONNX runtime and
# model, with no Node and no Python. GitHub mode downloads a release's
# payload; Bundle mode takes the same file from a bucket
# (deploy/make_bundle.sh), so the resource needs no outbound network. It
# runs on glibc 2.28 and later (RHEL 8, Ubuntu 22.04 and later).
#
# Topology (login-node placement):
#   setup ─┬─ get_ports ─┬─ pull_software ── build_gufi ── index_kb ── run_app ── expose_session
#   (build_gufi and index_kb only report: GUFI ships in the app, and the
#   server indexes once it answers)
#          └─────────────┘
#
# Scheduler placement: the "Submit as a Scheduler Job" toggle instead runs
# stage_compute ── submit_compute, which package the whole stack (container
# source only, optionally with a vLLM model serve on the node's GPUs) as one
# batch job in the resource's scheduler dialect (Slurm or PBS, detected from
# the resource). The job ends with the walltime; corpus, index, and session
# names persist. Documented in deploy/COMPUTE.md.
# ============================================================================
permissions:
  - '*'

'on':
  execute:
    inputs:
      resource_and_execution:
        label: "Step 1: Choose the cluster"
        type: group
        collapsed: false
        items:
          resource:
            label: Resource Target
            type: compute-clusters
            autoselect: true
            optional: false
          scheduler:
            label: Submit as a Scheduler Job
            type: boolean
            default: true
            hidden: ${{ inputs.resource_and_execution.resource.schedulerType == '' }}
            tooltip: |
              On, the whole stack runs as one batch job on a compute node,
              submitted in the resource's scheduler dialect (Slurm or PBS),
              optionally with a vLLM model serve on the node's GPUs; the app
              ends with the walltime and relaunches reuse the corpus, index,
              and session names. Off, the app runs on the login node and
              outlives the workflow. Scheduler placement runs the container
              source only.
      slurm:
        label: "Step 2: Your scheduler account"
        type: group
        collapsed: false
        hidden: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler == false }}
        items:
          account:
            default: ""
            label: Account
            type: slurm-accounts
            resource: ${{ inputs.resource_and_execution.resource }}
            optional: true
            ignore: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler == false }}
            tooltip: Scheduler account for the job (--account).
          partition:
            default: "standard"
            label: Partition
            type: slurm-partitions
            resource: ${{ inputs.resource_and_execution.resource }}
            optional: true
            ignore: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler == false }}
            tooltip: Partition with the GPUs (--partition). Empty uses the cluster default.
          qos:
            default: "standard"
            label: Quality of Service
            type: slurm-qos
            resource: ${{ inputs.resource_and_execution.resource }}
            optional: true
            ignore: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler == false }}
            tooltip: QOS for the job (--qos), where the site requires one.
          walltime:
            label: Walltime
            type: string
            default: "02:00:00"
            tooltip: The stack ends with the job (--time). Relaunching reuses the corpus, index, and session names.
          scheduler_directives:
            label: Extra Scheduler Directives
            type: string
            default: "--gres=gpu:h100_nvl:1"
            optional: true
            tooltip: Semicolon-separated sbatch directives without the #SBATCH prefix, e.g. a --gres=gpu:<type>:<count> request on systems that require an explicit GRES.
      pbs:
        label: "Step 2: Your scheduler account (PBS systems)"
        type: group
        collapsed: true
        hidden: ${{ inputs.resource_and_execution.resource.schedulerType != 'pbs' || inputs.resource_and_execution.scheduler == false }}
        items:
          account:
            label: Account
            type: string
            default: ''
            optional: true
            tooltip: Allocation for the job (-A).
          queue:
            label: Queue
            type: string
            default: ''
            optional: true
            tooltip: Queue for the job (-q). Empty uses the cluster default.
          walltime:
            label: Walltime
            type: string
            default: '02:00:00'
            tooltip: The stack ends with the job (-l walltime=). Relaunching reuses the corpus, index, and session names.
          scheduler_directives:
            label: Extra Scheduler Directives
            type: string
            default: '-l select=1:ngpus=1'
            optional: true
            tooltip: Semicolon-separated qsub directives without the #PBS prefix; the select statement names the node shape the site requires.
      session_settings:
        label: "Advanced: Session and URL"
        type: group
        collapsed: true
        items:
          session_name:
            label: Session Name
            type: string
            default: "cfd-studio-${USER}"
            tooltip: >-
              Session and endpoint name, and also the URL subdomain, so keep it stable
              across relaunches. Shell variables are expanded, so a name like
              studio-${USER} gives each person their own session and URL where several
              people launch the same workflow.
          unique_suffix:
            label: Append Port to Session Name
            type: boolean
            default: false
            tooltip: Appends the app port to the session name so each launch gets a unique URL. Leave off for a stable URL that survives relaunches.
          session_method:
            label: Session Method
            type: dropdown
            default: web
            options:
              - label: Web (endpoint URL)
                value: web
              - label: E2E test (verify & tear down)
                value: e2e
              - label: Cleanup (stop everything from prior launches)
                value: cleanup
            tooltip: |
              Web     → pw endpoints http exposes the app at a root URL.
              E2E     → launch everything, assert HTTP 200 at /healthz, tear down, exit.
              Cleanup → stop every process prior launches left on the node, then exit.
      app_settings:
        label: "Advanced: Application and image"
        type: group
        collapsed: true
        items:
          app_name:
            label: App Name
            type: string
            default: "CFD AI Studio"
            tooltip: Product name shown in the interface (APP_NAME).
          icon_path:
            label: Brand Icon Path
            type: string
            default: "${WORKDIR:-$HOME/pw}/studio-knowledge-base/.branding/icon.png"
            optional: true
            tooltip: >-
              Image used as the interface brand icon and favicon (APP_ICON).
              Either an https URL, or an absolute path on the resource, in
              which case stage the file first (for a container deployment it
              must sit under a bind-mounted directory, such as a .branding
              folder inside the knowledge base).
          icon_path_dark:
            label: Brand Icon Path (dark mode)
            type: string
            default: "${WORKDIR:-$HOME/pw}/studio-knowledge-base/.branding/icon-dark.png"
            optional: true
            tooltip: Icon variant for dark mode; same rules as the light icon. Empty reuses the light icon.
          banner_text:
            label: Classification Banner
            type: string
            default: ''
            optional: true
            tooltip: >-
              Banner text across the top of the app, e.g. the CUI marking. The platform draws
              its own banner around an embedded session, so this one appears only when the app
              is opened on its own; editable later in Settings.
          banner_color:
            label: Classification Banner Color
            type: string
            default: ''
            optional: true
            tooltip: Banner background as #rrggbb. Empty uses green (#24612e). Text color follows the background.
          suggested_prompts:
            label: Chat Starter Prompts
            type: string
            default: "What cases are in this knowledge base and what does each simulate?;How does snappyHexMesh refine the mesh around the motorBike body?;Show me the motorBike surface geometry.;What boundary conditions does the damBreak case use for the water phase?"
            optional: true
            tooltip: Semicolon-separated example questions shown on the empty chat page. Empty keeps the app defaults; editable later in Settings.
          workdir:
            label: Work Directory
            type: string
            default: "${WORKDIR:-$HOME/pw}"
            tooltip: Directory on the resource where the app is unpacked, built, and run.
          source:
            label: App Source
            type: dropdown
            default: "container"
            options:
              - label: Container (Apptainer image; pinned runtime, no build on the resource)
                value: container
              - label: GitHub release (download the Linux app)
                value: github
              - label: Bundle (bucket or pre-staged; for air-gapped systems)
                value: bundle
            tooltip: |
              Container → run a prebuilt Apptainer image of the Linux app
              (deploy/app-go.def; each release publishes one to ghcr.io), so
              host differences stop mattering.
              GitHub release → download the Linux app of a release from GitHub
              (needs outbound HTTPS to github.com); nothing is built on the
              resource.
              Bundle → the same Linux app (deploy/make_bundle.sh), pulled from the
              bucket or pre-staged at <workdir>/bundle-prestage.tar.gz; nothing is
              fetched from the internet.
          container_dir:
            label: Container Scratch Directory
            type: string
            default: /tmp/studio-container
            hidden: ${{ inputs.app_settings.source != 'container' }}
            tooltip: >-
              Where the image and its expanded sandbox live on the resource.
              Keep this on node-local disk, since it is derived from the image
              and costs nothing to recreate, while a shared filesystem charges
              for the space and extracts far more slowly.
          image_path:
            label: Container Image
            type: string
            default: "pw://mshaxted/codeassist/studio.sif; /p/app/projects/hsp/cfd-training/containers/studio.sif"
            optional: true
            hidden: ${{ inputs.app_settings.source != 'container' }}
            tooltip: Path to the .sif on the resource, a platform bucket URI (pw://user/bucket/studio.sif), or a library/docker URI the container runtime can pull. Several may be listed, separated by semicolons, and the first that works is used, so a shared copy can name a bucket behind it. Empty looks for studio.sif in the work directory.
          repo_url:
            label: Repository URL
            type: string
            default: https://github.com/parallelworks/activate-studio
            hidden: ${{ inputs.app_settings.source == 'bundle' }}
            tooltip: Repository whose releases carry the Linux app (activate-studio-linux-x86_64.tar.gz).
          git_ref:
            label: Release
            type: string
            default: main
            hidden: ${{ inputs.app_settings.source == 'bundle' }}
            tooltip: A release tag (such as v1.190), or main for the current Stable release.
          rundir:
            label: Run Directory
            type: string
            default: ${PW_PARENT_JOB_DIR}
            hidden: true
          bundlebucket:
            label: Bundle Bucket
            type: bucket
            optional: true
            tooltip: Bucket holding the deployment bundle built by deploy/make_bundle.sh. If the platform bucket API is unavailable, pre-stage the bundle on the resource as <workdir>/bundle-prestage.tar.gz instead; the pull step falls back to it.
          bundle_file:
            label: Bundle File
            type: string
            default: studio-bundle.tar.gz
            tooltip: Filename of the bundle in the bucket. Bump to roll to a newer build.
          refresh_software:
            label: Load Latest Bundle
            type: boolean
            default: false
            tooltip: Replace the app in the work directory even when it came from the same release or bundle file; the index, settings and credentials are kept.
          office_runtime:
            label: LibreOffice Runtime (bucket)
            type: string
            optional: true
            tooltip: Bucket path of an office-runtime.tar.gz (the official LibreOffice Linux binaries repacked as a relocatable directory). Pulled and cached once per host when soffice is absent, like the Node runtime, so Word, PowerPoint and Excel files render as pages. Leave empty to fall back to extracted-text previews.
          app_port:
            label: App Port
            type: number
            default: 0
            hidden: true
      kb_settings:
        label: "Advanced: Knowledge base and mission"
        type: group
        collapsed: true
        items:
          kb_root:
            label: Knowledge Base Directory
            type: string
            default: "${WORKDIR:-$HOME/pw}/studio-knowledge-base"
            tooltip: The directory to index and serve. Created if missing; point it at an existing corpus to work over it.
          index_base:
            label: Index Directory
            type: string
            default: "${WORKDIR:-$HOME/pw}/studio-index"
            optional: true
            tooltip: Where the search index, settings, and credential store live. Empty keeps them in <workdir>/data/index; set an absolute path (e.g. a /shared location) to survive work-directory rebuilds.
          starter_dirs:
            label: Starter Directories
            type: string
            default: ''
            optional: true
            tooltip: Comma-separated directory names for a knowledge base that is new or empty (e.g. papers,software,datasets). Empty uses the default set, and a knowledge base that already holds content is never touched.
          starter_bundle:
            label: Starter Knowledge Base (bucket)
            type: string
            default: "/p/app/projects/hsp/cfd-training/cfd-starter-kb.tar.gz; pw://mshaxted/codeassist/cfd-starter-kb.tar.gz"
            optional: true
            tooltip: Tarball pulled and extracted into an empty knowledge base on first launch, so a fresh deployment starts with a working corpus. Takes a bucket URI, a path on the resource, or several of either separated by semicolons, in which case the first that works is used. A knowledge base that already has content is never touched. Scheduler placement only.
          kb_label:
            label: Knowledge Base Label
            type: string
            default: "CFD Knowledge Base"
            tooltip: Display name in the interface.
          mission:
            default: "This is the CFD AI Studio, a workspace for computational fluid dynamics engineering. The corpus holds complete OpenFOAM tutorial cases, tutorials for running each, solver manuals, papers, surface geometry models, and prior chat sessions. Its purpose is helping engineers understand, run, and adapt CFD cases and answering questions grounded in this material."
            label: Mission and Context
            type: string
            optional: true
            tooltip: One short paragraph on what this Studio is for; injected into the assistant's system prompt and editable later in Settings.
          libraries:
            label: Additional Libraries
            type: string
            optional: true
            tooltip: |
              Other indexes this Studio mounts read only, as a JSON list. Each entry
              needs an id and an indexRoot (a GUFI tree); a label and a sourceRoot
              (where the files are, when they are on this host) are optional.
          sections:
            label: Visible Sections
            type: string
            optional: true
            tooltip: |
              Comma-separated list of the sections to show, from chat, library,
              search, query, overview, history, agents, workflows. Leave empty for all of them.
          workflows:
            label: Offered Workflows
            type: string
            optional: true
            tooltip: |
              Comma-separated workflows to offer as tiles on the Workflows tab, in
              order: account workflow names, marketplace/<slug>, or
              github.com/<owner>/<repo>[/path][@ref]. Each viewer runs them under
              their own account.
              Administrators can also pick them in Settings, Workflows, from the
              workflows on the account this Studio is deployed under.
          build_gufi:
            label: Build GUFI Index Engine
            type: boolean
            default: true
            hidden: true
            tooltip: Kept for saved inputs. GUFI ships built in the app, so nothing is built on the resource.
          run_index:
            label: Index on Launch
            type: boolean
            default: true
            tooltip: Start a full index (metadata, text extraction, embeddings) once the server answers; the Studio serves while it builds. Turn off for a relaunch on an unchanged corpus, which the server keeps in sync as files change.
      model_settings:
        label: "Advanced: Model serving"
        type: group
        collapsed: true
        items:
          posture:
            label: Deployment Posture
            type: dropdown
            default: single
            options:
              - label: Single user (no identity, deployment credential only)
                value: single
              - label: Multi-user, shared credential (no key collection)
                value: multi-shared
              - label: Multi-user, personal keys allowed
                value: multi-personal
              - label: Multi-user, personal keys required
                value: multi-strict
            tooltip: |
              Single user runs with no platform identity and never creates the
              per-user credential store. Multi-user postures verify the platform
              identity header; shared keeps everyone on the deployment credential
              with key collection hard-disabled, personal lets users add their own
              model keys, strict requires them for chat. Multi-user postures need
              the platform host below.
          platform_host:
            label: Platform Host (multi-user postures)
            type: string
            default: ''
            optional: true
            tooltip: Platform host for identity verification, e.g. activate.parallel.works; the JWKS path is appended automatically. Ignored for the single-user posture.
          pw_api_key:
            label: Gateway API Key
            type: string
            default: ''
            optional: true
            tooltip: OpenAI-compatible gateway credential for chat. Empty uses the pw CLI credential on the resource when one exists; chat is disabled otherwise, every other feature still works.
          gateway_url:
            label: Gateway Base URL
            type: string
            default: ''
            optional: true
            tooltip: Override the OpenAI-compatible endpoint base URL (defaults to the ACTIVATE platform gateway).
          serve:
            label: Serve a Model in the Job
            type: boolean
            default: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Scheduler placement only. Start vLLM on the job's GPUs and point the Studio at it; off, the Studio uses the gateway settings above.
          model_dir:
            label: Model Directory
            type: string
            default: "/p/app/projects/hsp/cfd-training/models/gemma-4-31B-it-heretic"
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: HuggingFace-format model directory on the resource. Empty derives <workdir>/models/<model id>. Downloaded on the login node when missing and a model id is set; a read-only shared copy is served in place, so one copy covers every user.
          hf_model_id:
            label: HuggingFace Model ID
            type: string
            default: "coder3101/gemma-4-31B-it-heretic"
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Downloaded into the model directory when it does not exist yet.
          hf_token:
            label: HuggingFace Token
            type: string
            default: ''
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
          served_name:
            label: Served Model Name
            type: string
            default: "gemma-4-31b-it"
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
          vllm_image:
            label: vLLM Image (bucket or path)
            type: string
            default: "/p/app/projects/hsp/cfd-training/containers/vllm.sif; pw://mshaxted/codeassist/vllm-0.27.sif"
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Bucket URI or path of the vLLM Apptainer image, or several separated by semicolons, the first that works being used. Staged beside the Studio image and cached on the resource.
          gpu_ids:
            label: GPU IDs
            type: string
            default: '0'
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: CUDA_VISIBLE_DEVICES for the model server. The Studio itself needs no GPU.
          vllm_args:
            label: vLLM Arguments
            type: string
            default: "--tensor-parallel-size 1 --gpu-memory-utilization 0.92 --max-model-len 32768 --kv-cache-dtype fp8 --trust-remote-code --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4 --chat-template /vllm-workspace/examples/tool_chat_template_gemma4.jinja"
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Tool-call and reasoning parsers are model-specific; a Gemma 4 model wants --tool-call-parser gemma4 --reasoning-parser gemma4 and its chat template, a Qwen model --tool-call-parser qwen3_coder --reasoning-parser qwen3.
          register_openai:
            label: Register the Model in the Catalog
            type: boolean
            default: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Also expose the served model as a platform model (pw endpoints --openai), so other tools can use it while the job runs.
          model_endpoint_name:
            label: Model Endpoint Name
            type: string
            default: "gemma-${USER}"
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: >-
              Platform endpoint name for the served model, expanded like the session
              name, so gemma-${USER} gives each person their own. Empty derives
              <session name>-model.
jobs:
  setup:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: Create directories
        run: |
          mkdir -p ${{ inputs.app_settings.workdir }}
          mkdir -p ${{ inputs.kb_settings.kb_root }}
          if [ -n "${{ inputs.kb_settings.index_base }}" ]; then
            mkdir -p "${{ inputs.kb_settings.index_base }}"
          fi
  get_ports:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    outputs:
      APP_PORT: ${{ needs.get_ports.steps.ports.outputs.APP_PORT }}
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: Get open port
        id: ports
        run: |
          if [[ ${{ inputs.app_settings.app_port }} == "0" ]]; then
            APP_PORT=$(pw agent open-port)
          else
            APP_PORT=${{ inputs.app_settings.app_port }}
          fi
          echo "App port: $APP_PORT"
          echo APP_PORT=$APP_PORT >> $OUTPUTS
  pull_software:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: Put the app in place
        run: |
          if [ "${{ inputs.session_settings.session_method }}" = "cleanup" ]; then
            echo "Cleanup run; nothing to pull."
            exit 0
          fi
          if [ "${{ inputs.app_settings.source }}" = "container" ]; then
            CDIR="${{ inputs.app_settings.container_dir }}"
            [ -n "$CDIR" ] || CDIR="${{ inputs.app_settings.workdir }}"
            mkdir -p "$CDIR" || { echo "ERROR: cannot create $CDIR"; exit 1; }
            cd "$CDIR"
            IMG="${{ inputs.app_settings.image_path }}"
            [ -n "$IMG" ] || IMG="$PWD/studio.sif"
            command -v apptainer >/dev/null 2>&1 || command -v singularity >/dev/null 2>&1 || \
              { echo "ERROR: neither apptainer nor singularity is on the resource"; exit 1; }
            RUNTIME="$(command -v apptainer || command -v singularity)"
            case "$IMG" in
              pw://*|s3://*|gs://*|az://*)
                # Platform buckets are not something the container runtime
                # can pull; stage through the CLI instead.
                echo "Staging image from bucket: $IMG"
                # The CLI draws a carriage-return progress bar, which the
                # platform log viewer renders as one endless line; keep the
                # transcript readable and surface only the outcome.
                pw buckets cp "$IMG" "$PWD/studio.sif" > bucket-cp.log 2>&1 \
                  || { echo "ERROR: bucket copy failed"; tr '\r' '\n' < bucket-cp.log | tail -3; exit 1; }
                echo "staged image: $(du -h "$PWD/studio.sif" | cut -f1)"
                IMG="$PWD/studio.sif" ;;
              *://*)
                echo "Pulling image $IMG ..."
                "$RUNTIME" pull -F "$PWD/studio.sif" "$IMG" || { echo "ERROR: image pull failed"; exit 1; }
                IMG="$PWD/studio.sif" ;;
            esac
            [ -f "$IMG" ] || { echo "ERROR: container image not found: $IMG"; exit 1; }
            # A SIF is a squashfs image, and some login nodes run kernels
            # without squashfs (and without squashfuse or the privileges to
            # load the module). Where the runtime cannot mount the image,
            # expand it once into a sandbox directory and run from that;
            # unsquashfs needs no kernel support. Cached against the image's
            # timestamp so a rerun does not repeat the extraction.
            if "$RUNTIME" exec "$IMG" true 2>/dev/null; then
              echo "$IMG" > .image
            else
              echo "Runtime cannot mount the image directly (no squashfs); expanding to a sandbox."
              command -v unsquashfs >/dev/null 2>&1 || { echo "ERROR: no squashfs support and unsquashfs is unavailable"; exit 1; }
              if [ -d sandbox ] && [ -f .sandbox-src ] && [ "$(cat .sandbox-src)" = "$IMG:$(stat -c %Y "$IMG")" ]; then
                echo "Sandbox already expanded from this image."
              else
                FS_ID=$("$RUNTIME" sif list "$IMG" | awk -F'|' '$5 ~ /Squashfs/ { gsub(/ /, "", $1); print $1; exit }')
                [ -n "$FS_ID" ] || { echo "ERROR: no squashfs partition found in $IMG"; exit 1; }
                rm -rf sandbox rootfs.squash
                "$RUNTIME" sif dump "$FS_ID" "$IMG" > rootfs.squash || { echo "ERROR: could not read the image partition"; exit 1; }
                # -no-xattrs: the destination is often a filesystem that
                # refuses them, and nothing in the image depends on them.
                unsquashfs -q -f -no-xattrs -d sandbox rootfs.squash || { echo "ERROR: sandbox expansion failed"; exit 1; }
                rm -f rootfs.squash
                echo "$IMG:$(stat -c %Y "$IMG")" > .sandbox-src
              fi
              echo "$PWD/sandbox" > .image
              # The image itself is no longer needed once expanded, and on a
              # shared filesystem it is pure cost.
              case "${{ inputs.app_settings.image_path }}" in
                *://*) rm -f "$IMG" ;;
              esac
            fi
            cp .image "${{ inputs.app_settings.workdir }}/.image"
            echo "container: $(cat .image) ($("$RUNTIME" --version))"
            exit 0
          fi
          cd ${{ inputs.app_settings.workdir }}
          set -e
          # The app is the Linux payload (activate-studio-linux-x86_64.tar.gz),
          # from a GitHub release or the same file from a bucket. Each copy is
          # named by where it came from, so a relaunch on the same one keeps it.
          ASSET=activate-studio-linux-x86_64.tar.gz
          if [ "${{ inputs.app_settings.source }}" = "github" ]; then
            REF="${{ inputs.app_settings.git_ref }}"
            # A release tag names that release; anything else, main included,
            # is the current Stable release, the fixed "linux" release.
            case "$REF" in v[0-9]*) TAG="$REF" ;; *) TAG=linux ;; esac
            URL="$(printf '%s' "${{ inputs.app_settings.repo_url }}" | sed 's|/*$||; s|\.git$||')/releases/download/$TAG/$ASSET"
            SUM="$(curl -fsSL --retry 3 "$URL.sha256" | awk '{print $1}')" || true
            [ -n "$SUM" ] || { echo "ERROR: no $ASSET in release $TAG ($URL.sha256)"; exit 1; }
            KEY="github:$TAG:$SUM"
          else
            BUNDLE="${{ inputs.app_settings.bundle_file }}"
            KEY="bundle:$BUNDLE"
          fi
          if [ -x payload/app/bin/studio-server ] && [ "$(cat .bundle 2>/dev/null)" = "$KEY" ] && [ "${{ inputs.app_settings.refresh_software }}" != "true" ]; then
            echo "The app is in place ($KEY)."
          else
            rm -f incoming.tar.gz
            if [ "${{ inputs.app_settings.source }}" = "github" ]; then
              echo "Downloading $URL ..."
              curl -fsSL --retry 3 -o incoming.tar.gz "$URL"
              echo "$SUM  incoming.tar.gz" | sha256sum -c - >/dev/null || { echo "ERROR: the download does not match its checksum"; exit 1; }
            else
              echo "Pulling bundle $BUNDLE ..."
              # Bucket inputs interpolate as objects; .uri is required (the bare
              # form injects JSON and the copy fails silently).
              pw buckets cp "${{ inputs.app_settings.bundlebucket.uri }}/$BUNDLE" ./incoming.tar.gz > bucket-cp.log 2>&1 || {
                tr '\r' '\n' < bucket-cp.log | tail -3
                if [ -f bundle-prestage.tar.gz ]; then
                  echo "Bucket pull failed; using pre-staged bundle-prestage.tar.gz"
                  cp bundle-prestage.tar.gz incoming.tar.gz
                else
                  echo "ERROR: bundle pull failed and no pre-staged bundle found"; exit 1
                fi
              }
            fi
            if ! tar -tzf incoming.tar.gz activate-studio/app/bin/studio-server >/dev/null 2>&1; then
              echo "ERROR: this is not the Studio's Linux app (no activate-studio/app/bin/studio-server)."
              echo "A bundle made before the Go version carries the Node server; make one with deploy/make_bundle.sh."
              exit 1
            fi
            rm -rf payload.new
            mkdir payload.new
            tar -xzf incoming.tar.gz -C payload.new --strip-components=1
            rm -f incoming.tar.gz
            # The window shells and the installer are the desktop's.
            rm -rf payload.new/bin payload.new/share payload.new/install.sh payload.new/uninstall.sh
            payload.new/app/bin/studio-server routes >/dev/null || { echo "ERROR: the Studio's server does not run here (it needs glibc 2.28 or later)"; exit 1; }
            # One previous copy is kept beside it.
            rm -rf payload.prev
            if [ -d payload ]; then mv payload payload.prev; fi
            mv payload.new payload
            echo "$KEY" > .bundle
          fi
          # The Node version's tree goes. With no index directory set, its
          # index, settings and credential store were app/index; they become
          # data/index.
          if [ -d app/index ] && [ -z "${{ inputs.kb_settings.index_base }}" ] && [ ! -e data/index ]; then
            mkdir -p data
            mv app/index data/index
            echo "Moved the index, settings and credentials from app/index to data/index."
          fi
          rm -rf app node-runtime node-*-linux-x64.tar.xz gufi-install GUFI gufi-src.tar.gz cache repo
          echo "app: $(tr -d '\n ' < payload/app/build-info.json 2>/dev/null)"
      - name: Office rendering runtime when soffice is absent
        run: |
          cd ${{ inputs.app_settings.workdir }}
          RT_URI="${{ inputs.app_settings.office_runtime }}"
          if [ -z "$RT_URI" ]; then echo "No office runtime configured."; exit 0; fi
          if command -v soffice >/dev/null 2>&1; then echo "System soffice present; staged runtime not needed."; exit 0; fi
          SOFFICE="$(find "$PWD/office-runtime" -name soffice -path "*/program/*" 2>/dev/null | head -1)"
          if [ -z "$SOFFICE" ]; then
            PW_BIN="$(command -v pw || echo pw)"
            "$PW_BIN" buckets cp "$RT_URI" office-runtime.tar.gz || { echo "office runtime pull failed; office rendering stays unavailable."; exit 0; }
            tar -xzf office-runtime.tar.gz && rm -f office-runtime.tar.gz
            SOFFICE="$(find "$PWD/office-runtime" -name soffice -path "*/program/*" | head -1)"
          fi
          [ -n "$SOFFICE" ] || { echo "no soffice in the runtime; office rendering stays unavailable."; exit 0; }
          printf '#!/bin/bash\nexec "%s" "$@"\n' "$SOFFICE" > soffice-wrapper.sh
          chmod +x soffice-wrapper.sh
          echo "Office rendering via staged runtime: $SOFFICE"
      - name: Search by meaning model
        run: |
          # The ONNX model ships in the app; the index refers to it at
          # INDEX_BASE/models/minilm-l6, a link, so a new app's model is the
          # one used.
          if [ "${{ inputs.session_settings.session_method }}" = "cleanup" ]; then exit 0; fi
          if [ "${{ inputs.app_settings.source }}" = "container" ]; then
            echo "Container mode; the image carries the model."
            exit 0
          fi
          cd ${{ inputs.app_settings.workdir }}
          INDEX_BASE="${{ inputs.kb_settings.index_base }}"
          [ -n "$INDEX_BASE" ] || INDEX_BASE="$PWD/data/index"
          mkdir -p "$INDEX_BASE/models"
          if [ -L "$INDEX_BASE/models/minilm-l6" ] || [ ! -e "$INDEX_BASE/models/minilm-l6" ]; then
            ln -sfn "$PWD/payload/models/minilm-l6" "$INDEX_BASE/models/minilm-l6"
          fi
          echo "Search by meaning model: $(ls "$INDEX_BASE/models/minilm-l6/" | tr '\n' ' ')"

  build_gufi:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
      - pull_software
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: GUFI
        run: |
          # GUFI ships built in the app (payload/gufi); nothing is built here.
          if [ "${{ inputs.session_settings.session_method }}" = "cleanup" ]; then exit 0; fi
          if [ "${{ inputs.app_settings.source }}" = "container" ]; then echo "Container mode; GUFI ships inside the image."; exit 0; fi
          cd ${{ inputs.app_settings.workdir }}
          payload/gufi/bin/gufi_query --help >/dev/null 2>&1 || payload/gufi/bin/gufi_query -h >/dev/null 2>&1 || true
          ls payload/gufi/bin/gufi_query payload/gufi/bin/gufi_dir2index

  index_kb:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
      - build_gufi
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: Index the knowledge base
        run: |
          # The server builds the index once it answers (expose_session), and
          # serves while it builds.
          echo "Index on launch: ${{ inputs.kb_settings.run_index }}"

  run_app:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
      - index_kb
      - get_ports
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      # The old deployment stays alive through the whole build: stopping it
      # here, after pull, build, and index all succeeded, means a failed
      # build leaves the previous version serving instead of a dead app
      # (learned when a transient GitHub reset killed a relaunch).
      - name: Stop dangling processes from a prior launch
        run: |
          cd ${{ inputs.app_settings.workdir }}
          # The watchdog dies first so it cannot resurrect what follows.
          # The pid file is best effort; the sweep below catches watchdogs
          # whose pid file is stale or was written wrong.
          if [ -f watchdog.pid ]; then
            kill "$(cat watchdog.pid)" 2>/dev/null || true
            rm -f watchdog.pid
          fi
          for p in $(pgrep -f "bash watchdog[.]sh" 2>/dev/null); do
            [ "$(readlink /proc/$p/cwd 2>/dev/null)" = "$PWD" ] && kill -9 "$p" 2>/dev/null && echo "  swept stale watchdog $p"
          done
          if [ -f app-custom.pids ]; then
            echo "Stopping processes from a prior launch:"; cat app-custom.pids || true
            while read -r p; do
              [ -n "$p" ] || continue
              kill "$p" 2>/dev/null || true
              kill -- -"$p" 2>/dev/null || true
            done < app-custom.pids
          fi
          : > app-custom.pids
          # Sweep by pattern too, scoped so other deployments on the node
          # survive: studio servers are matched by working directory, the
          # endpoint agent by this deployment's session name.
          for p in $(pgrep -f "app/server/dist/main[.]js|payload/app/bin/studio-server" 2>/dev/null); do
            [ "$(readlink /proc/$p/cwd 2>/dev/null)" = "$PWD" ] && kill "$p" 2>/dev/null && echo "  swept stale server $p"
          done
          PREFIX="$(eval echo "${{ inputs.session_settings.session_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          [ -n "$PREFIX" ] || PREFIX="studio"
          pkill -f "endpoints http.*--name ${PREFIX}" 2>/dev/null && echo "  swept stale endpoint agent (${PREFIX})" || true
      - name: Generate run_app.sh
        run: |
          RUNDIR="${{ inputs.app_settings.rundir }}"
          WORKDIR="${{ inputs.app_settings.workdir }}"
          SCRIPT="${RUNDIR}/run_app.sh"
          mkdir -p ${RUNDIR}

          cat > ${SCRIPT} << 'SCRIPT_HEADER'
          #!/bin/bash
          export PATH="$HOME/.local/bin:$HOME/pw:$PATH"
          hostname; date; pwd
          SCRIPT_HEADER

          echo "pushd ${WORKDIR}" >> ${SCRIPT}
          # The app's own server, GUFI, tesseract, ONNX runtime and STEP
          # modules, as deploy/app-go.def sets them for the container.
          if [ "${{ inputs.app_settings.source }}" != "container" ]; then
            cat >> ${SCRIPT} << 'PAYLOAD_ENV'
          P="$PWD/payload"
          export STUDIO_NODE=off STUDIO_PROJECT_ROOT="$P/app" STUDIO_ORT_LIB="$P/app/lib/libonnxruntime.so.1" \
            STUDIO_OCCT_WASM="$P/app/occt/occt-import-js.wasm" STUDIO_SEMANTIC_MAP_BIN="$P/app/bin/semantic-map" \
            GUFI_BIN="$P/gufi/bin" TESSDATA_PREFIX="$P/ocr/share/tessdata"
          export PATH="$P/ocr/bin:$PATH"
          PAYLOAD_ENV
          fi
          echo "export PORT=${{ needs.get_ports.outputs.APP_PORT }}" >> ${SCRIPT}
          echo "export KB_ROOT=${{ inputs.kb_settings.kb_root }}" >> ${SCRIPT}
          echo "export KB_LABEL='${{ inputs.kb_settings.kb_label }}'" >> ${SCRIPT}
          # The mission is free text; a quoted heredoc plus %q survives any
          # quoting the operator types (apostrophes included).
          KB_MISSION_TEXT=$(cat << 'MISSION_EOF'
          ${{ inputs.kb_settings.mission }}
          MISSION_EOF
          )
          printf 'export KB_MISSION=%q\n' "$KB_MISSION_TEXT" >> ${SCRIPT}
          if [ -x "${WORKDIR}/soffice-wrapper.sh" ]; then
            echo "export SOFFICE_BIN=${WORKDIR}/soffice-wrapper.sh" >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.kb_settings.index_base }}" ]; then
            echo "export INDEX_BASE='${{ inputs.kb_settings.index_base }}'" >> ${SCRIPT}
          else
            echo "export INDEX_BASE=${WORKDIR}/data/index" >> ${SCRIPT}
          fi
          echo "export APP_NAME='${{ inputs.app_settings.app_name }}'" >> ${SCRIPT}
          if [ -n "${{ inputs.app_settings.banner_text }}" ]; then
            echo "export BANNER_TEXT='${{ inputs.app_settings.banner_text }}'" >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.app_settings.banner_color }}" ]; then
            echo "export BANNER_COLOR='${{ inputs.app_settings.banner_color }}'" >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.kb_settings.starter_dirs }}" ]; then
            echo "export KB_STARTER_DIRS='${{ inputs.kb_settings.starter_dirs }}'" >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.kb_settings.libraries }}" ]; then
            printf 'export STUDIO_LIBRARIES=%q\n' '${{ inputs.kb_settings.libraries }}' >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.kb_settings.sections }}" ]; then
            printf 'export STUDIO_SECTIONS=%q\n' '${{ inputs.kb_settings.sections }}' >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.kb_settings.workflows }}" ]; then
            printf 'export STUDIO_WORKFLOWS=%q\n' '${{ inputs.kb_settings.workflows }}' >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.app_settings.icon_path }}" ]; then
            echo "export APP_ICON='${{ inputs.app_settings.icon_path }}'" >> ${SCRIPT}
          fi
          PROMPTS='${{ inputs.app_settings.suggested_prompts }}'
          if [ -n "$PROMPTS" ]; then
            JSON="["
            IFS=';'
            first=1
            for q in $PROMPTS; do
              q=$(echo "$q" | xargs | sed 's/\\/\\\\/g; s/"/\\"/g')
              [ -n "$q" ] || continue
              [ "$first" = "1" ] && first=0 || JSON="$JSON,"
              JSON="$JSON\"$q\""
            done
            unset IFS
            JSON="$JSON]"
            echo "export SUGGESTED_PROMPTS='$JSON'" >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.model_settings.pw_api_key }}" ]; then
            echo "export PW_API_KEY='${{ inputs.model_settings.pw_api_key }}'" >> ${SCRIPT}
          fi
          if [ -n "${{ inputs.model_settings.gateway_url }}" ]; then
            echo "export PW_GATEWAY_URL='${{ inputs.model_settings.gateway_url }}'" >> ${SCRIPT}
          fi
          POSTURE='${{ inputs.model_settings.posture }}'
          PLATFORM_HOST='${{ inputs.model_settings.platform_host }}'
          if [ "$POSTURE" != "single" ] && [ -n "$PLATFORM_HOST" ]; then
            echo "export AUTH_JWKS_URL='https://${PLATFORM_HOST}/api/platform/keys'" >> ${SCRIPT}
            echo "export AUTH_ISSUER='pw-session-proxy'" >> ${SCRIPT}
          fi
          if [ "$POSTURE" = "multi-shared" ]; then
            echo "export DISABLE_PERSONAL_KEYS=1" >> ${SCRIPT}
          fi
          if [ "$POSTURE" = "multi-strict" ]; then
            echo "export REQUIRE_PERSONAL_KEY=1" >> ${SCRIPT}
          fi

          if [ "${{ inputs.session_settings.session_method }}" = "cleanup" ]; then
            cat >> ${SCRIPT} << 'CLEANUP_BODY'
          echo "CLEANUP RUN: stopping all Studio processes from prior launches on this node."
          if [ -f app-custom.pids ]; then
            while read -r p; do [ -n "$p" ] && kill "$p" 2>/dev/null && echo "  killed $p"; done < app-custom.pids
            : > app-custom.pids
          fi
          for pat in "server/dist/main[.]js" "payload/app/bin/studio-server" "pw endpoints http.*studio"; do
            pkill -f "$pat" 2>/dev/null && echo "  killed by pattern: $pat"
          done
          echo "cleanup complete"
          CLEANUP_BODY
            cat ${SCRIPT}
            exit 0
          fi

          if [ "${{ inputs.app_settings.source }}" = "container" ]; then
            # The image tests for 1 exactly; "true" reads as off.
            if [ "${{ inputs.kb_settings.run_index }}" = "true" ]; then
              echo "export INDEX_ON_START=1" >> ${SCRIPT}
            else
              echo "export INDEX_ON_START=0" >> ${SCRIPT}
            fi
            cat >> ${SCRIPT} << 'CONTAINER_LAUNCH'
          IMG="$(cat .image 2>/dev/null)"
          RUNTIME="$(command -v apptainer || command -v singularity)"
          echo "Starting Studio container on port ${PORT} over ${KB_ROOT} ..."
          # The corpus and all writable state stay on the host; the image is
          # read-only. DATA_DIR holds the index, settings, and credentials.
          setsid nohup "$RUNTIME" run \
            --env PORT="${PORT}" --env KB_ROOT="${KB_ROOT}" --env DATA_DIR="${INDEX_BASE}" \
            --env INDEX_BASE="${INDEX_BASE}" --env KB_LABEL="${KB_LABEL}" \
            --env APP_NAME="${APP_NAME}" --env INDEX_ON_START="${INDEX_ON_START}" \
            ${KB_STARTER_DIRS:+--env KB_STARTER_DIRS="${KB_STARTER_DIRS}"} \
            ${STUDIO_LIBRARIES:+--env STUDIO_LIBRARIES="${STUDIO_LIBRARIES}"} \
            ${STUDIO_SECTIONS:+--env STUDIO_SECTIONS="${STUDIO_SECTIONS}"} \
            ${STUDIO_WORKFLOWS:+--env STUDIO_WORKFLOWS="${STUDIO_WORKFLOWS}"} \
            ${BANNER_TEXT:+--env BANNER_TEXT="${BANNER_TEXT}"} \
            ${BANNER_COLOR:+--env BANNER_COLOR="${BANNER_COLOR}"} \
            ${APP_ICON:+--env APP_ICON="${APP_ICON}"} \
            ${SUGGESTED_PROMPTS:+--env SUGGESTED_PROMPTS="${SUGGESTED_PROMPTS}"} \
            ${PW_API_KEY:+--env PW_API_KEY="${PW_API_KEY}"} \
            ${PW_GATEWAY_URL:+--env PW_GATEWAY_URL="${PW_GATEWAY_URL}"} \
            ${AUTH_JWKS_URL:+--env AUTH_JWKS_URL="${AUTH_JWKS_URL}"} \
            ${AUTH_ISSUER:+--env AUTH_ISSUER="${AUTH_ISSUER}"} \
            ${DISABLE_PERSONAL_KEYS:+--env DISABLE_PERSONAL_KEYS="${DISABLE_PERSONAL_KEYS}"} \
            ${REQUIRE_PERSONAL_KEY:+--env REQUIRE_PERSONAL_KEY="${REQUIRE_PERSONAL_KEY}"} \
            --bind "${KB_ROOT}:${KB_ROOT}" --bind "${INDEX_BASE}:${INDEX_BASE}" \
            "$IMG" > app.log 2>&1 < /dev/null &
          CONTAINER_LAUNCH
          else
            cat >> ${SCRIPT} << 'APP_LAUNCH'
          echo "Starting Studio server on port ${PORT} over ${KB_ROOT} ..."
          setsid nohup "$PWD/payload/app/bin/studio-server" > app.log 2>&1 < /dev/null &
          APP_LAUNCH
          fi
          cat >> ${SCRIPT} << 'APP_LAUNCH'
          echo "$!" >> app-custom.pids
          echo "Server forked; logs: $(pwd)/app.log"
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/${PORT}) 2>/dev/null && { exec 3>&- 3<&-; echo "app listening after ~$(( (i-1) * 2 ))s"; break; }
            sleep 2
          done
          # The watchdog restarts a failed server with STUDIO_APP_ONLY set and
          # leaves the endpoint agent running: once the workflow run has
          # ended, its credential can no longer register a new endpoint.
          if [ -n "${STUDIO_APP_ONLY:-}" ]; then
            echo "Server restarted; the endpoint agent and watchdog keep running."
            exit 0
          fi
          if [ "${{ inputs.session_settings.session_method }}" = "web" ]; then
            PREFIX="$(eval echo "${{ inputs.session_settings.session_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
            [ -n "$PREFIX" ] || PREFIX="studio"
            if [ "${{ inputs.session_settings.unique_suffix }}" = "true" ]; then
              EP_NAME="${PREFIX}-${PORT}"
            else
              EP_NAME="${PREFIX}"
            fi
            PW_BIN="$(command -v pw || echo pw)"
            echo "Forking web endpoint ${EP_NAME} -> localhost:${PORT}; log: $(pwd)/endpoint.log"
            # No --keep: a session that outlives its server is a URL that
            # resolves to nothing, and it hides from anyone reading the session
            # list that the deployment is down. The watchdog below restarts the
            # app and re-registers, which covers the case --keep was there for.
            setsid nohup "$PW_BIN" endpoints http -o text --name "$EP_NAME" --subdomain "$EP_NAME" "$PORT" > endpoint.log 2>&1 < /dev/null &
            echo "$!" >> app-custom.pids
            echo "$!" > agent.pid
            # Watchdog: if the app stops answering, restart the server alone
            # on the same port, so the endpoint keeps serving the same URL.
            # If the endpoint agent process dies, kill what is left of this
            # deployment (servers scoped by workdir, the agent by recorded
            # pid) and re-run this script for a clean start. Liveness uses the app health URL and
            # the agent pid file; matching the agent by command line proved
            # unreliable. A workflow relaunch kills the watchdog first, so
            # the two never fight.
            RUN_SCRIPT="$(cd "$(dirname "$0")" && pwd)/$(basename "$0")"
            cat > watchdog.sh << WATCHDOG
          cd "\$(dirname "\$0")"
          while sleep 120; do
            app=1; agent=1
            curl -sf -m 8 "localhost:${PORT}/healthz" > /dev/null || app=0
            kill -0 "\$(cat agent.pid 2>/dev/null)" 2>/dev/null || agent=0
            [ "\$app\$agent" = 11 ] && continue
            for p in \$(pgrep -f "app/server/dist/main[.]js|payload/app/bin/studio-server" 2>/dev/null); do
              [ "\$(readlink /proc/\$p/cwd 2>/dev/null)" = "\$PWD" ] && kill "\$p" 2>/dev/null
            done
            sleep 3
            if [ "\$agent" = 1 ]; then
              echo "\$(date -Is) server unhealthy; restarting the server only" >> watchdog.log
              STUDIO_APP_ONLY=1 bash "${RUN_SCRIPT}" >> watchdog.log 2>&1
            else
              echo "\$(date -Is) endpoint agent gone; restarting stack" >> watchdog.log
              kill "\$(cat agent.pid 2>/dev/null)" 2>/dev/null
              bash "${RUN_SCRIPT}" >> watchdog.log 2>&1
            fi
            sleep 60
          done
          WATCHDOG
            if [ -f watchdog.pid ]; then kill "$(cat watchdog.pid)" 2>/dev/null || true; fi
            setsid nohup bash watchdog.sh > /dev/null 2>&1 < /dev/null &
            echo "$!" > watchdog.pid
            echo "Watchdog forked; log: $(pwd)/watchdog.log"
          fi
          echo "Done running main workflow script."
          APP_LAUNCH
          cat ${SCRIPT}
      - name: Launch app on the login node
        run: |
          bash ${{ inputs.app_settings.rundir }}/run_app.sh 2>&1 | tee ${{ inputs.app_settings.rundir }}/run_app.out
  expose_session:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
      - run_app
      - get_ports
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: Verify and surface the session
        run: |
          cd ${{ inputs.app_settings.workdir }}
          METHOD="${{ inputs.session_settings.session_method }}"
          PORT=${{ needs.get_ports.outputs.APP_PORT }}
          if [ "$METHOD" = "cleanup" ]; then
            echo "Cleanup run complete; no session created."
            exit 0
          fi
          up=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:${PORT}/healthz" || echo 000)
            if [ "$code" != "000" ]; then
              echo "App responding (HTTP ${code}) after ~$(( (i-1) * 5 ))s."
              up=1
              break
            fi
            sleep 5
          done
          if [ "$METHOD" = "e2e" ]; then
            body=$(curl -s --max-time 10 "http://localhost:${PORT}/healthz" || echo '')
            echo "healthz: $body"
            echo "Tearing down forked processes..."
            if [ -f app-custom.pids ]; then
              while read -r p; do
                [ -n "$p" ] || continue
                kill "$p" 2>/dev/null || true
                kill -- -"$p" 2>/dev/null || true
              done < app-custom.pids
              : > app-custom.pids
            fi
            if [ "$up" = "1" ] && echo "$body" | grep -q '"ok":true'; then
              echo "E2E PASS: bundle unpacked, server answered healthz, torn down cleanly."
            else
              echo "E2E FAIL: server never answered healthz (see app.log in the workdir)."
              exit 1
            fi
            exit 0
          fi
          [ "$up" = "1" ] || echo "WARNING: app never responded; check app.log. Continuing."
          # The index on launch (the container's image starts its own).
          if [ "$up" = "1" ] && [ "${{ inputs.kb_settings.run_index }}" = "true" ] && [ "${{ inputs.app_settings.source }}" != "container" ]; then
            if curl -fsS -m 30 -X POST -H 'content-type: application/json' -d '{}' "http://localhost:${PORT}/api/reindex" > /dev/null; then
              echo "Started a full index; the Studio serves while it builds."
            else
              echo "WARNING: the index on launch did not start; Settings, Indexing starts one."
            fi
          fi
          echo "Web endpoint was forked in run_app.sh; URL from endpoint.log:"
          for i in $(seq 1 12); do
            [ -s endpoint.log ] && break
            sleep 5
          done
          head -30 endpoint.log 2>/dev/null || echo "(endpoint.log not found)"

  stage_compute:
    if: ${{ inputs.resource_and_execution.scheduler == true }}
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: Stage directories, images, and starter corpus
        run: |
          if [ "${{ inputs.session_settings.session_method }}" = "cleanup" ]; then
            echo "Cleanup run; nothing to stage."
            exit 0
          fi
          if [ "${{ inputs.app_settings.source }}" != "container" ]; then
            echo "ERROR: scheduler placement runs the container source only; set App Source to Container."
            exit 1
          fi
          WORKDIR="$(eval echo '${{ inputs.app_settings.workdir }}')"
          RUNDIR="$WORKDIR/compute-run"
          KB="$(eval echo '${{ inputs.kb_settings.kb_root }}')"
          IDX="$(eval echo '${{ inputs.kb_settings.index_base }}')"
          [ -n "$IDX" ] || IDX="$WORKDIR/studio-index"
          mkdir -p "$RUNDIR" "$KB" "$IDX" "$WORKDIR/containers"
          PW_BIN="$(command -v pw || echo ~/pw/pw)"
          # An empty knowledge base seeds itself from the starter bundle, so
          # a first launch lands with a working corpus; existing content is
          # never touched.
          BUNDLES="${{ inputs.kb_settings.starter_bundle }}"
          if [ -n "$BUNDLES" ] && [ -z "$(ls -A "$KB" 2>/dev/null)" ]; then
            SRC=""; USED=""
            OLDIFS="$IFS"; IFS=';,'
            for BUNDLE in $BUNDLES; do
              IFS="$OLDIFS"
              BUNDLE="$(echo "$BUNDLE" | xargs)"
              [ -n "$BUNDLE" ] || continue
              case "$BUNDLE" in
                pw://*|s3://*|gs://*|az://*)
                  if "$PW_BIN" buckets cp "$BUNDLE" "$RUNDIR/starter-kb.tar.gz" > bundle-cp.log 2>&1; then
                    SRC="$RUNDIR/starter-kb.tar.gz"; USED="$BUNDLE"; break
                  fi
                  tr '\r' '\n' < bundle-cp.log | tail -3 ;;
                *)
                  # A tarball already on the resource, e.g. one shared copy
                  # every trainee reads.
                  if [ -r "$BUNDLE" ]; then SRC="$BUNDLE"; USED="$BUNDLE"; break; fi
                  echo "Not readable here, trying the next source: $BUNDLE" ;;
              esac
              IFS=';,'
            done
            IFS="$OLDIFS"
            if [ -n "$SRC" ] && tar -xzf "$SRC" -C "$KB"; then
              echo "Seeded the knowledge base from $USED"
            else
              echo "No starter bundle could be read; continuing with an empty knowledge base."
            fi
            rm -f "$RUNDIR/starter-kb.tar.gz"
          fi
          # Images live on the shared filesystem so the compute node sees
          # what the login node staged; an existing file is reused, delete
          # it to force a fresh pull.
          # Each setting may list several sources, separated by semicolons or
          # commas, and the first that works wins. That lets one deployment
          # name a shared copy on its own filesystem and a bucket behind it,
          # so the same configuration still launches on a system where that
          # path does not exist.
          # The bucket cache is keyed by destination path alone, so once a
          # copy exists it is reused whatever the source now holds. That
          # makes a bucket-hosted image impossible to update for anyone who
          # has launched before, which is the wrong default for the one
          # artifact that changes with every fix. Refresh Software clears
          # the cached copy first so the next launch takes the current one.
          # Lowercased because the form sends a real boolean ("true") while a
          # CLI launch that fills inputs by hand can easily send the string
          # "True", and a case-sensitive test turns that into a silent no-op:
          # the launch reports success and quietly keeps the cached image.
          REFRESH="$(printf '%s' "${{ inputs.app_settings.refresh_software }}" | tr '[:upper:]' '[:lower:]')"
          resolve() { # $1 = configured sources, $2 = cache path; prints the usable path
            SRCS="$1"; DST="$2"
            [ -n "$SRCS" ] || SRCS="$DST"
            OLDIFS="$IFS"; IFS=';,'
            for SRC in $SRCS; do
              IFS="$OLDIFS"
              SRC="$(echo "$SRC" | xargs)"
              [ -n "$SRC" ] || continue
              case "$SRC" in
                pw://*|s3://*|gs://*|az://*)
                  if [ -f "$DST" ] && [ "$REFRESH" != "true" ]; then echo "$DST"; return 0; fi
                  [ "$REFRESH" = "true" ] && [ -f "$DST" ] && \
                    { echo "Refresh requested; discarding the cached $DST" >&2; rm -f "$DST"; }
                  echo "Staging $SRC -> $DST" >&2
                  if "$PW_BIN" buckets cp "$SRC" "$DST" > image-cp.log 2>&1; then
                    echo "$DST"; return 0
                  fi
                  tr '\r' '\n' < image-cp.log | tail -3 >&2 ;;
                *)
                  if [ -r "$SRC" ]; then echo "$SRC"; return 0; fi
                  echo "Not readable here, trying the next source: $SRC" >&2 ;;
              esac
              IFS=';,'
            done
            IFS="$OLDIFS"
            return 1
          }
          cd "$RUNDIR"
          # resolve runs in a subshell, so a failure inside it cannot end
          # the step; the empty result is what this checks.
          SSIF="$(resolve "${{ inputs.app_settings.image_path }}" "$WORKDIR/containers/studio.sif")"
          [ -n "$SSIF" ] || { echo "ERROR: Studio image unavailable: ${{ inputs.app_settings.image_path }}"; exit 1; }
          VSIF="$WORKDIR/containers/vllm.sif"
          if [ "${{ inputs.model_settings.serve }}" = "true" ]; then
            VSIF="$(resolve "${{ inputs.model_settings.vllm_image }}" "$WORKDIR/containers/vllm.sif")"
            [ -n "$VSIF" ] || { echo "ERROR: vLLM image unavailable: ${{ inputs.model_settings.vllm_image }}"; exit 1; }
          fi
          printf 'SSIF=%s\nVSIF=%s\n' "$SSIF" "$VSIF" > "$RUNDIR/images.env"
          cat "$RUNDIR/images.env"

      - name: Fetch the model if missing
        run: |
          if [ "${{ inputs.session_settings.session_method }}" = "cleanup" ]; then exit 0; fi
          if [ "${{ inputs.model_settings.serve }}" != "true" ]; then echo "Not serving a model."; exit 0; fi
          WORKDIR="$(eval echo '${{ inputs.app_settings.workdir }}')"
          MODEL_DIR="$(eval echo '${{ inputs.model_settings.model_dir }}')"
          [ -n "$MODEL_DIR" ] || MODEL_DIR="$WORKDIR/models/$(basename '${{ inputs.model_settings.hf_model_id }}')"
          if [ -f "$MODEL_DIR/config.json" ]; then echo "Model present at $MODEL_DIR; reusing."; exit 0; fi
          if [ -z "${{ inputs.model_settings.hf_model_id }}" ]; then echo "ERROR: no model directory and no model id to download."; exit 1; fi
          # pip on the login node rather than the container: some login
          # nodes exhaust user namespaces and refuse containers entirely.
          python3 -m pip install --user -q "huggingface_hub[cli]"
          HF_TOKEN='${{ inputs.model_settings.hf_token }}' ~/.local/bin/hf download '${{ inputs.model_settings.hf_model_id }}' --local-dir "$MODEL_DIR"
          ls "$MODEL_DIR" | head -5

  submit_compute:
    if: ${{ inputs.resource_and_execution.scheduler == true }}
    needs:
      - stage_compute
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
      - name: Write the job script
        run: |
          if [ "${{ inputs.session_settings.session_method }}" = "cleanup" ]; then exit 0; fi
          WORKDIR="$(eval echo '${{ inputs.app_settings.workdir }}')"
          RUNDIR="$WORKDIR/compute-run"
          cd "$RUNDIR"
          KB="$(eval echo '${{ inputs.kb_settings.kb_root }}')"
          IDX="$(eval echo '${{ inputs.kb_settings.index_base }}')"
          [ -n "$IDX" ] || IDX="$WORKDIR/studio-index"
          # Paths resolved during staging: a shared image is read where it
          # sits, a bucket image from the per-user cache.
          SSIF="$WORKDIR/containers/studio.sif"; VSIF="$WORKDIR/containers/vllm.sif"
          [ -f "$RUNDIR/images.env" ] && . "$RUNDIR/images.env"
          MODEL_DIR="$(eval echo '${{ inputs.model_settings.model_dir }}')"
          [ -n "$MODEL_DIR" ] || MODEL_DIR="$WORKDIR/models/$(basename '${{ inputs.model_settings.hf_model_id }}')"
          PW_BIN="$(command -v pw || echo ~/pw/pw)"
          SESSION="$(eval echo "${{ inputs.session_settings.session_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          [ -n "$SESSION" ] || SESSION="studio"
          # Expanded and slugified like the session name, since this is an
          # endpoint name too and several people may run the same workflow.
          MODEL_EP="$(eval echo "${{ inputs.model_settings.model_endpoint_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          [ -n "$MODEL_EP" ] || MODEL_EP="${SESSION}-model"
          ICON="$(eval echo '${{ inputs.app_settings.icon_path }}')"
          ICON_DARK="$(eval echo '${{ inputs.app_settings.icon_path_dark }}')"
          # Free text arrives through quoted heredocs so an apostrophe, a
          # quote, or a line break in an operator's wording cannot break the
          # script that carries it.
          MISSION=$(cat << 'FIELD_EOF'
          ${{ inputs.kb_settings.mission }}
          FIELD_EOF
          )
          APP_NAME=$(cat << 'FIELD_EOF'
          ${{ inputs.app_settings.app_name }}
          FIELD_EOF
          )
          KB_LABEL=$(cat << 'FIELD_EOF'
          ${{ inputs.kb_settings.kb_label }}
          FIELD_EOF
          )
          PROMPTS=$(cat << 'FIELD_EOF'
          ${{ inputs.app_settings.suggested_prompts }}
          FIELD_EOF
          )
          BANNER_TEXT=$(cat << 'FIELD_EOF'
          ${{ inputs.app_settings.banner_text }}
          FIELD_EOF
          )
          VLLM_ARGS=$(cat << 'FIELD_EOF'
          ${{ inputs.model_settings.vllm_args }}
          FIELD_EOF
          )
          PROMPTS_JSON=$(P="$PROMPTS" python3 -c "import json,os; print(json.dumps([q.strip() for q in os.environ['P'].split(';') if q.strip()]))")
          JWKS=""
          if [ "${{ inputs.model_settings.posture }}" != "single" ] && [ -n "${{ inputs.model_settings.platform_host }}" ]; then
            JWKS="https://${{ inputs.model_settings.platform_host }}/api/platform/keys"
          fi
          DISABLE_KEYS=""; [ "${{ inputs.model_settings.posture }}" = "multi-shared" ] && DISABLE_KEYS=1
          REQUIRE_KEY=""; [ "${{ inputs.model_settings.posture }}" = "multi-strict" ] && REQUIRE_KEY=1
          # The image tests INDEX_ON_START=1 exactly, so "true" reads as off and
          # the corpus is served unindexed with search silently on the grep
          # fallback. Send what the image checks for.
          INDEX_ON_START=0; [ "${{ inputs.kb_settings.run_index }}" = "true" ] && INDEX_ON_START=1

          # Every launch-specific value lands here, %q-quoted, so the job
          # script itself stays a plain readable script with no generated
          # substitutions in its body.
          {
            printf 'RUNDIR=%q\n'         "$RUNDIR"
            printf 'KB=%q\n'             "$KB"
            printf 'IDX=%q\n'            "$IDX"
            printf 'SSIF=%q\n'           "$SSIF"
            printf 'VSIF=%q\n'           "$VSIF"
            printf 'MODEL_DIR=%q\n'      "$MODEL_DIR"
            printf 'PW_BIN=%q\n'         "$PW_BIN"
            printf 'SESSION=%q\n'        "$SESSION"
            printf 'MODEL_EP=%q\n'       "$MODEL_EP"
            printf 'SERVE=%q\n'          '${{ inputs.model_settings.serve }}'
            printf 'GPU_IDS=%q\n'        '${{ inputs.model_settings.gpu_ids }}'
            printf 'SERVED_NAME=%q\n'    '${{ inputs.model_settings.served_name }}'
            printf 'VLLM_ARGS=%q\n'      "$VLLM_ARGS"
            printf 'REGISTER_OPENAI=%q\n' '${{ inputs.model_settings.register_openai }}'
            printf 'GATEWAY_URL=%q\n'    '${{ inputs.model_settings.gateway_url }}'
            printf 'GATEWAY_KEY=%q\n'    '${{ inputs.model_settings.pw_api_key }}'
            printf 'APP_NAME=%q\n'       "$APP_NAME"
            printf 'KB_LABEL=%q\n'       "$KB_LABEL"
            printf 'STARTER_DIRS=%q\n'   '${{ inputs.kb_settings.starter_dirs }}'
            printf 'BANNER_TEXT=%q\n'    "$BANNER_TEXT"
            printf 'BANNER_COLOR=%q\n'   '${{ inputs.app_settings.banner_color }}'
            printf 'ICON=%q\n'           "$ICON"
            printf 'ICON_DARK=%q\n'      "$ICON_DARK"
            printf 'MISSION=%q\n'        "$MISSION"
            printf 'PROMPTS_JSON=%q\n'   "$PROMPTS_JSON"
            printf 'JWKS=%q\n'           "$JWKS"
            printf 'DISABLE_KEYS=%q\n'   "$DISABLE_KEYS"
            printf 'REQUIRE_KEY=%q\n'    "$REQUIRE_KEY"
            printf 'INDEX_ON_START=%q\n' "$INDEX_ON_START"
          } > job.env
          cat job.env

          # The only generated line in the job script is the path to the
          # values above; the scheduler copies the script elsewhere, so it
          # cannot find them relative to itself.
          printf '#!/bin/bash\nJOB_ENV=%q\n' "$RUNDIR/job.env" > job.sh
          cat >> job.sh << 'JOB'
          set -u
          . "$JOB_ENV"
          cd "$RUNDIR"

          # The run directory persists across launches; stale logs from the
          # previous job must not satisfy this launch's watchers.
          : > endpoint.log; : > model-endpoint.log; : > vllm.out; : > studio.out

          RUNTIME="$(command -v apptainer || command -v singularity)"
          cleanup() {
            "$RUNTIME" instance stop studio-compute-vllm 2>/dev/null
            [ -f model-endpoint.pid ] && kill "$(cat model-endpoint.pid)" 2>/dev/null
            # The endpoint agent deletes its own session when it exits
            # cleanly, but a walltime kill never lets it, which leaves a
            # record behind pointing at a node that is no longer serving.
            # Delete both by name; a session that has already gone makes
            # this a no-op.
            [ -n "$MODEL_EP" ] && "$PW_BIN" endpoints delete "$MODEL_EP" > /dev/null 2>&1
            [ -n "$SESSION" ] && "$PW_BIN" endpoints delete "$SESSION" > /dev/null 2>&1
            return 0
          }
          # EXIT alone does not fire when the shell is killed by a signal,
          # which is exactly how a job ends at its walltime.
          trap cleanup EXIT INT TERM

          pickport() { python3 -c 'import socket; s=socket.socket(); s.bind(("",0)); print(s.getsockname()[1]); s.close()'; }

          # A model served in this job takes the node's GPUs and the Studio
          # points at it; otherwise the Studio uses the configured gateway.
          if [ "$SERVE" = "true" ]; then
            VPORT=$(pickport)
            "$RUNTIME" instance start --nv --cleanenv --writable-tmpfs \
              --bind "$MODEL_DIR:/model" --bind "$PWD:/rundir" \
              "$VSIF" studio-compute-vllm
            "$RUNTIME" exec instance://studio-compute-vllm bash -c "
              export CUDA_VISIBLE_DEVICES='$GPU_IDS'
              nohup python3 -m vllm.entrypoints.openai.api_server \
                --model /model --served-model-name '$SERVED_NAME' \
                --host 0.0.0.0 --port $VPORT $VLLM_ARGS \
                > /rundir/vllm.out 2>&1 &
            "
            for i in $(seq 1 240); do
              curl -s -m 5 "localhost:$VPORT/v1/models" | grep -q '"id"' && { echo "vLLM up after ~$((i*5))s"; break; }
              pgrep -f "openai.api_server.*--port $VPORT" > /dev/null || { echo "vLLM exited:"; tail -30 vllm.out; exit 1; }
              sleep 5
            done
            curl -s -m 5 "localhost:$VPORT/v1/models" | grep -q '"id"' || { echo "vLLM never came up:"; tail -30 vllm.out; exit 1; }
            # The served model is given to the Studio as a second target
            # rather than as the gateway. Replacing the gateway made this
            # model the only one anybody could pick, which hid the platform
            # provider models (GenAI.mil and the rest) from a deployment
            # that is otherwise entitled to them. Listed side by side, the
            # private model on this node and the platform providers appear
            # in one picker and either can be called in the same
            # conversation. Where no platform credential is configured the
            # Studio still finds one from the pw CLI store bound in below,
            # and if there is genuinely none, the local model stands alone,
            # which is the old behaviour.
            SIDECAR_URL="http://localhost:$VPORT/v1"
              # No --keep: a model session outliving its job points at nothing.
            if [ "$REGISTER_OPENAI" = "true" ]; then
              setsid nohup "$PW_BIN" endpoints http --openai -o text \
                --name "$MODEL_EP" "$VPORT" > model-endpoint.log 2>&1 < /dev/null &
              echo $! > model-endpoint.pid
            fi
          fi


          # The Studio runs under the endpoint agent rather than beside it:
          # `endpoints run` owns the process tree and tears it down when the
          # endpoint goes, so deleting the session releases the node instead
          # of leaving the job to burn the rest of its walltime. The walltime
          # remains the backstop for a session nobody deletes.
          # The endpoint agent joins the command it is given back into one
          # string, so a --env value containing a space arrives as separate
          # arguments and the container is handed nonsense. Keep the whole
          # invocation in a script and let the agent run just that; the port
          # it assigns arrives in the environment.
          # The launcher runs as a fresh shell, so it reads the same %q-quoted
          # values the job script uses rather than having them pasted in: a JSON
          # value re-parsed by a second shell loses its quoting, and the starter
          # prompts are JSON. Only the runtime and the gateway are added here,
          # since both are decided after job.env was written.
          printf 'RUNTIME=%q\nGATEWAY_URL=%q\nGATEWAY_KEY=%q\nSIDECAR_URL=%q\n' \
            "$RUNTIME" "$GATEWAY_URL" "$GATEWAY_KEY" "${SIDECAR_URL:-}" >> "$JOB_ENV"
          printf '#!/bin/bash\nJOB_ENV=%q\n' "$JOB_ENV" > launch-studio.sh
          cat >> launch-studio.sh << 'LAUNCH'
          . "$JOB_ENV"
          # Restart rather than die. The endpoint agent owns this process
          # tree, so when the Studio exits the endpoint is removed and the
          # job ends, taking any model serving beside it on the node with
          # it. A crash should cost a reconnect, not the allocation. A
          # clean exit (code 0) is a real shutdown and ends the loop; a
          # crash is retried a few times and then allowed to fail, so a
          # deployment that cannot start does not restart forever.
          tries=0
          while :; do
            "$RUNTIME" run --cleanenv \
            --env PORT="$PORT" --env KB_ROOT="$KB" --env DATA_DIR="$IDX" \
            --env INDEX_BASE="$IDX" --env KB_LABEL="$KB_LABEL" \
            --env APP_NAME="$APP_NAME" --env INDEX_ON_START="$INDEX_ON_START" \
            --env KB_MISSION="$MISSION" --env KB_STARTER_DIRS="$STARTER_DIRS" \
            --env SUGGESTED_PROMPTS="$PROMPTS_JSON" \
            --env APP_ICON="$ICON" --env APP_ICON_DARK="$ICON_DARK" \
            ${GATEWAY_URL:+--env PW_GATEWAY_URL="$GATEWAY_URL"} \
            ${GATEWAY_KEY:+--env PW_API_KEY="$GATEWAY_KEY"} \
            ${BANNER_TEXT:+--env BANNER_TEXT="$BANNER_TEXT"} \
            ${BANNER_COLOR:+--env BANNER_COLOR="$BANNER_COLOR"} \
            ${JWKS:+--env AUTH_JWKS_URL="$JWKS"} \
            ${JWKS:+--env AUTH_ISSUER="pw-session-proxy"} \
            ${DISABLE_KEYS:+--env DISABLE_PERSONAL_KEYS="$DISABLE_KEYS"} \
            ${REQUIRE_KEY:+--env REQUIRE_PERSONAL_KEY="$REQUIRE_KEY"} \
            ${SIDECAR_URL:+--env SIDECAR_MODEL_URL="$SIDECAR_URL"} \
            ${SIDECAR_URL:+--env SIDECAR_ENDPOINT="$MODEL_EP"} \
            --env PW_CLI="/usr/local/bin/pw" --env HOME="$HOME" \
            --bind "$PW_BIN:/usr/local/bin/pw" \
            --bind "$KB:$KB" --bind "$IDX:$IDX" \
            "$SSIF" && break
            rc=$?
            tries=$((tries + 1))
            if [ "$tries" -ge 5 ]; then
              echo "Studio exited $rc five times; not restarting again."
              exit "$rc"
            fi
            echo "Studio exited $rc; restarting (attempt $tries of 5)."
            sleep 5
          done
          LAUNCH
          chmod +x launch-studio.sh
          # The agent owns this process tree: deleting the session ends the job.
          "$PW_BIN" endpoints run --name "$SESSION" --subdomain "$SESSION" -- \
            bash "$RUNDIR/launch-studio.sh" 2>&1 | tee studio.out

          # Reached when the endpoint is deleted, the Studio exits, or the
          # walltime arrives; the trap stops the model beside it.
          echo "Studio endpoint closed; ending the job."
          JOB
          chmod +x job.sh
          bash -n job.sh && echo "job script syntax ok"

      - name: Submit in the resource's scheduler dialect and watch
        run: |
          WORKDIR="$(eval echo '${{ inputs.app_settings.workdir }}')"
          RUNDIR="$WORKDIR/compute-run"
          mkdir -p "$RUNDIR"; cd "$RUNDIR"
          METHOD="${{ inputs.session_settings.session_method }}"
          STYPE="${{ inputs.resource_and_execution.resource.schedulerType }}"
          SESSION="$(eval echo "${{ inputs.session_settings.session_name }}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          [ -n "$SESSION" ] || SESSION="studio"
          JOB_NAME="studio-$SESSION"
          echo "scheduler dialect: ${STYPE:-none}"

          cancel_by_name() {
            if [ "$STYPE" = "slurm" ]; then
              scancel --name "$JOB_NAME" 2>/dev/null || true
            elif [ "$STYPE" = "pbs" ]; then
              # PBS caps job names; cancel what a prior submit could have used.
              for id in $(qselect -N "$(echo "$JOB_NAME" | cut -c1-15)" 2>/dev/null); do qdel "$id" 2>/dev/null || true; done
            fi
          }
          if [ "$METHOD" = "cleanup" ]; then
            echo "Cleanup run: cancelling any $JOB_NAME job."
            cancel_by_name
            exit 0
          fi

          # One stack per session name: end any previous job before submitting.
          cancel_by_name
          # A fresh output file per submission: a watcher reading a prior
          # job's leftover output mistakes its state for this run's.
          OUT="$RUNDIR/job-$(date +%s).out"
          ln -sf "$OUT" "$RUNDIR/job.out"
          # CLI-supplied partial input groups arrive with unset fields empty
          # (form defaults live only in the form), so walltime is backed by
          # a fallback; empty partition, account, qos, and queue mean the
          # flag is omitted and the cluster default applies.
          if [ "$STYPE" = "slurm" ]; then
            WALLTIME='${{ inputs.slurm.walltime }}'; [ -n "$WALLTIME" ] || WALLTIME='02:00:00'
            {
              echo "#SBATCH --job-name=$JOB_NAME"
              echo "#SBATCH --nodes=1"
              echo "#SBATCH --time=$WALLTIME"
              # Ask for SIGTERM at the batch shell a minute before the
              # walltime, so the cleanup trap has time to delete the
              # endpoint sessions instead of being killed outright and
              # leaving them behind as stopped records.
              echo "#SBATCH --signal=B:TERM@60"
              echo "#SBATCH --output=$OUT"
              [ -n "${{ inputs.slurm.partition }}" ] && echo "#SBATCH --partition=${{ inputs.slurm.partition }}"
              [ -n "${{ inputs.slurm.account }}" ] && echo "#SBATCH --account=${{ inputs.slurm.account }}"
              [ -n "${{ inputs.slurm.qos }}" ] && echo "#SBATCH --qos=${{ inputs.slurm.qos }}"
              DIRECTIVES='${{ inputs.slurm.scheduler_directives }}'
              IFS=';'
              for d in $DIRECTIVES; do d=$(echo "$d" | xargs); [ -n "$d" ] && echo "#SBATCH $d"; done
              unset IFS
              true
            } > headers.sh
          elif [ "$STYPE" = "pbs" ]; then
            WALLTIME='${{ inputs.pbs.walltime }}'; [ -n "$WALLTIME" ] || WALLTIME='02:00:00'
            {
              echo "#PBS -N $(echo "$JOB_NAME" | cut -c1-15)"
              echo "#PBS -o $OUT"
              echo "#PBS -j oe"
              echo "#PBS -l walltime=$WALLTIME"
              [ -n "${{ inputs.pbs.account }}" ] && echo "#PBS -A ${{ inputs.pbs.account }}"
              [ -n "${{ inputs.pbs.queue }}" ] && echo "#PBS -q ${{ inputs.pbs.queue }}"
              DIRECTIVES='${{ inputs.pbs.scheduler_directives }}'
              IFS=';'
              for d in $DIRECTIVES; do d=$(echo "$d" | xargs); [ -n "$d" ] && echo "#PBS $d"; done
              unset IFS
              true
            } > headers.sh
          else
            echo "ERROR: the resource reports no scheduler; turn off scheduler placement or pick a cluster with one."
            exit 1
          fi
          { head -1 job.sh; cat headers.sh; tail -n +2 job.sh; } > job-submit.sh
          chmod +x job-submit.sh
          sed -n '1,20p' job-submit.sh

          if [ "$STYPE" = "slurm" ]; then
            JOBID=$(sbatch job-submit.sh | grep -oE '[0-9]+$') || { echo "ERROR: submission failed"; exit 1; }
            job_state() { squeue -j "$JOBID" -h -o %T 2>/dev/null || true; }
            is_running() { [ "$1" = "RUNNING" ]; }
          else
            QSUB_OUT=$(qsub job-submit.sh 2>&1) || { echo "ERROR: submission failed: $QSUB_OUT"; exit 1; }
            JOBID=$(echo "$QSUB_OUT" | head -1)
            job_state() { qstat -f "$JOBID" 2>/dev/null | grep job_state | cut -d'=' -f2 | tr -d ' '; }
            is_running() { [ "$1" = "R" ]; }
          fi
          echo "Submitted job $JOBID"
          for i in $(seq 1 240); do
            ST=$(job_state)
            [ -z "$ST" ] && { echo "Job left the queue; output:"; tail -40 job.out 2>/dev/null; exit 1; }
            is_running "$ST" && break
            sleep 15
          done
          echo "Job running; waiting for the session URL..."
          URL=""
          for i in $(seq 1 240); do
            URL=$(grep -oE "https://[^ ]+" endpoint.log 2>/dev/null | head -1 || true)
            [ -n "$URL" ] && { echo "Studio session: $URL"; break; }
            ST=$(job_state)
            [ -z "$ST" ] && { echo "Job ended before the session came up; output:"; tail -40 job.out 2>/dev/null; exit 1; }
            sleep 10
          done
          if [ "$METHOD" = "e2e" ]; then
            if [ -n "$URL" ]; then
              echo "E2E PASS: job ran, stack came up, session registered; cancelling the job."
              if [ "$STYPE" = "slurm" ]; then scancel "$JOBID"; else qdel "$JOBID"; fi
            else
              echo "E2E FAIL: session never came up; cancelling the job."
              if [ "$STYPE" = "slurm" ]; then scancel "$JOBID"; else qdel "$JOBID"; fi
              exit 1
            fi
            exit 0
          fi
          tail -5 job.out 2>/dev/null || true
