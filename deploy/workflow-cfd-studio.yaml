        \ do d=$(echo \"$d\" | xargs); [ -n \"$d\" ] && echo \"#SBATCH $d\"; done\n    unset IFS\n   \
        \ true\n  } > headers.sh\nelif [ \"$STYPE\" = \"pbs\" ]; then\n  WALLTIME='${{ inputs.pbs.walltime\
        \ }}'; [ -n \"$WALLTIME\" ] || WALLTIME='02:00:00'\n  {\n    echo \"#PBS -N $(echo \"$JOB_NAME\"\
        \ | cut -c1-15)\"\n    echo \"#PBS -o $OUT\"\n    echo \"#PBS -j oe\"\n    echo \"#PBS -l walltime=$WALLTIME\"\
        \n    [ -n \"${{ inputs.pbs.account }}\" ] && echo \"#PBS -A ${{ inputs.pbs.account }}\"\n   \
        \ [ -n \"${{ inputs.pbs.queue }}\" ] && echo \"#PBS -q ${{ inputs.pbs.queue }}\"\n    DIRECTIVES='${{\
        \ inputs.pbs.scheduler_directives }}'\n    IFS=';'\n    for d in $DIRECTIVES; do d=$(echo \"$d\"\
        \ | xargs); [ -n \"$d\" ] && echo \"#PBS $d\"; done\n    unset IFS\n    true\n  } > headers.sh\n\
        else\n  echo \"ERROR: the resource reports no scheduler; turn off scheduler placement or pick\
        \ a cluster with one.\"\n  exit 1\nfi\n{ head -1 job.sh; cat headers.sh; tail -n +2 job.sh; }\
        \ > job-submit.sh\nchmod +x job-submit.sh\nsed -n '1,20p' job-submit.sh\n\nif [ \"$STYPE\" = \"\
        slurm\" ]; then\n  JOBID=$(sbatch job-submit.sh | grep -oE '[0-9]+$') || { echo \"ERROR: submission\
        \ failed\"; exit 1; }\n  job_state() { squeue -j \"$JOBID\" -h -o %T 2>/dev/null || true; }\n\
        \  is_running() { [ \"$1\" = \"RUNNING\" ]; }\nelse\n  QSUB_OUT=$(qsub job-submit.sh 2>&1) ||\
        \ { echo \"ERROR: submission failed: $QSUB_OUT\"; exit 1; }\n  JOBID=$(echo \"$QSUB_OUT\" | head\
        \ -1)\n  job_state() { qstat -f \"$JOBID\" 2>/dev/null | grep job_state | cut -d'=' -f2 | tr -d\
        \ ' '; }\n  is_running() { [ \"$1\" = \"R\" ]; }\nfi\necho \"Submitted job $JOBID\"\nfor i in\
        \ $(seq 1 240); do\n  ST=$(job_state)\n  [ -z \"$ST\" ] && { echo \"Job left the queue; output:\"\
        ; tail -40 job.out 2>/dev/null; exit 1; }\n  is_running \"$ST\" && break\n  sleep 15\ndone\necho\
        \ \"Job running; waiting for the session URL...\"\nURL=\"\"\nfor i in $(seq 1 240); do\n  URL=$(grep\
        \ -oE \"https://[^ ]+\" endpoint.log 2>/dev/null | head -1 || true)\n  [ -n \"$URL\" ] && { echo\
        \ \"Studio session: $URL\"; break; }\n  ST=$(job_state)\n  [ -z \"$ST\" ] && { echo \"Job ended\
        \ before the session came up; output:\"; tail -40 job.out 2>/dev/null; exit 1; }\n  sleep 10\n\
        done\nif [ \"$METHOD\" = \"e2e\" ]; then\n  if [ -n \"$URL\" ]; then\n    echo \"E2E PASS: job\
        \ ran, stack came up, session registered; cancelling the job.\"\n    if [ \"$STYPE\" = \"slurm\"\
        \ ]; then scancel \"$JOBID\"; else qdel \"$JOBID\"; fi\n  else\n    echo \"E2E FAIL: session never\
        \ came up; cancelling the job.\"\n    if [ \"$STYPE\" = \"slurm\" ]; then scancel \"$JOBID\";\
        \ else qdel \"$JOBID\"; fi\n    exit 1\n  fi\n  exit 0\nfi\ntail -5 job.out 2>/dev/null || true\n"
