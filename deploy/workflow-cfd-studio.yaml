# Generated by deploy/make_cfd_training_yaml.py from deploy/workflow.yaml
# plus a site preset. Every deployment value is a form default here, so a
# launch needs only the resource, account, and QOS. Site-specific paths in
# this file are deliberate: it is the copy people add from the repository
# and run as is.
#
# Regenerate after changing deploy/workflow.yaml; do not hand-edit.
permissions:
- '*'
'on':
  execute:
    inputs:
      resource_and_execution:
        label: Resource & Execution
        type: group
        collapsed: false
        items:
          resource:
            label: Resource Target
            type: compute-clusters
            autoselect: true
            optional: false
          scheduler:
            label: Submit as a Scheduler Job
            type: boolean
            default: true
            hidden: ${{ inputs.resource_and_execution.resource.schedulerType == '' }}
            tooltip: 'On, the whole stack runs as one batch job on a compute node,

              submitted in the resource''s scheduler dialect (Slurm or PBS),

              optionally with a vLLM model serve on the node''s GPUs; the app

              ends with the walltime and relaunches reuse the corpus, index,

              and session names. Off, the app runs on the login node and

              outlives the workflow. Scheduler placement runs the container

              source only.

              '
      slurm:
        label: Slurm Job
        type: group
        collapsed: false
        hidden: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler
          == false }}
        items:
          account:
            label: Account
            type: slurm-accounts
            resource: ${{ inputs.resource_and_execution.resource }}
            optional: true
            ignore: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler
              == false }}
            tooltip: Scheduler account for the job (--account).
          partition:
            label: Partition
            type: slurm-partitions
            resource: ${{ inputs.resource_and_execution.resource }}
            optional: true
            ignore: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler
              == false }}
            tooltip: Partition with the GPUs (--partition). Empty uses the cluster default.
            default: standard
          qos:
            label: Quality of Service
            type: slurm-qos
            resource: ${{ inputs.resource_and_execution.resource }}
            optional: true
            ignore: ${{ inputs.resource_and_execution.resource.schedulerType != 'slurm' || inputs.resource_and_execution.scheduler
              == false }}
            tooltip: QOS for the job (--qos), where the site requires one.
          walltime:
            label: Walltime
            type: string
            default: 02:00:00
            tooltip: The stack ends with the job (--time). Relaunching reuses the corpus, index, and session
              names.
          scheduler_directives:
            label: Extra Scheduler Directives
            type: string
            default: --gres=gpu:h100_nvl:1
            optional: true
            tooltip: Semicolon-separated sbatch directives without the
      pbs:
        label: PBS Job
        type: group
        collapsed: true
        hidden: ${{ inputs.resource_and_execution.resource.schedulerType != 'pbs' || inputs.resource_and_execution.scheduler
          == false }}
        items:
          account:
            label: Account
            type: string
            default: ''
            optional: true
            tooltip: Allocation for the job (-A).
          queue:
            label: Queue
            type: string
            default: ''
            optional: true
            tooltip: Queue for the job (-q). Empty uses the cluster default.
          walltime:
            label: Walltime
            type: string
            default: 02:00:00
            tooltip: The stack ends with the job (-l walltime=). Relaunching reuses the corpus, index,
              and session names.
          scheduler_directives:
            label: Extra Scheduler Directives
            type: string
            default: -l select=1:ngpus=1
            optional: true
            tooltip: Semicolon-separated qsub directives without the
      session_settings:
        label: Session
        type: group
        collapsed: true
        items:
          session_name:
            label: Session Name
            type: string
            default: cfd-studio
            tooltip: Platform session for the web interface, per user, kept across relaunches. Change
              it to run more than one studio.
          unique_suffix:
            label: Append Port to Session Name
            type: boolean
            default: false
            tooltip: Appends the app port to the session name so each launch gets a unique URL. Leave
              off for a stable URL that survives relaunches.
          session_method:
            label: Session Method
            type: dropdown
            default: web
            options:
            - label: Web (endpoint URL)
              value: web
            - label: E2E test (verify & tear down)
              value: e2e
            - label: Cleanup (stop everything from prior launches)
              value: cleanup
            tooltip: 'Web     → pw endpoints http exposes the app at a root URL.

              E2E     → launch everything, assert HTTP 200 at /healthz, tear down, exit.

              Cleanup → stop every process prior launches left on the node, then exit.

              '
      app_settings:
        label: App & Bundle
        type: group
        collapsed: true
        items:
          app_name:
            label: App Name
            type: string
            default: CFD AI Studio
            tooltip: Product name shown in the interface (APP_NAME).
          icon_path:
            label: Brand Icon Path
            type: string
            default: ${WORKDIR:-$HOME/pw}/studio-knowledge-base/.branding/icon.png
            optional: true
            tooltip: Image used as the interface brand icon and favicon (APP_ICON). Either an https URL,
              or an absolute path on the resource, in which case stage the file first (for a container
              deployment it must sit under a bind-mounted directory, such as a .branding folder inside
              the knowledge base).
          icon_path_dark:
            label: Brand Icon Path (dark mode)
            type: string
            default: ${WORKDIR:-$HOME/pw}/studio-knowledge-base/.branding/icon-dark.png
            optional: true
            tooltip: Icon variant for dark mode; same rules as the light icon. Empty reuses the light
              icon.
          banner_text:
            label: Classification Banner
            type: string
            default: ''
            optional: true
            tooltip: Banner text across the top of the app, e.g. the CUI marking. The platform draws its
              own banner around an embedded session, so this one appears only when the app is opened on
              its own; editable later in Settings.
          banner_color:
            label: Classification Banner Color
            type: string
            default: ''
            optional: true
            tooltip: Banner background as
          suggested_prompts:
            label: Chat Starter Prompts
            type: string
            default: What cases are in this knowledge base and what does each simulate?;How does snappyHexMesh
              refine the mesh around the motorBike body?;Show me the motorBike surface geometry.;What
              boundary conditions does the damBreak case use for the water phase?
            optional: true
            tooltip: Semicolon-separated example questions shown on the empty chat page. Empty keeps the
              app defaults; editable later in Settings.
          workdir:
            label: Work Directory
            type: string
            default: ${WORKDIR:-$HOME/pw}
            tooltip: Directory on the resource where the app is unpacked, built, and run.
          source:
            label: App Source
            type: dropdown
            default: container
            options:
            - label: Container (Apptainer image; pinned runtime, no build on the resource)
              value: container
            - label: GitHub (clone and build on the resource)
              value: github
            - label: Bundle (bucket or pre-staged; for air-gapped systems)
              value: bundle
            tooltip: 'Container → run a prebuilt Apptainer image (deploy/app.def) that

              carries Node, Python, GUFI, and the embedding model, so nothing is

              compiled on the resource and host differences stop mattering.

              GitHub → clone the repository on the resource and build there (needs

              outbound HTTPS to github.com and nodejs.org; Node is fetched

              automatically when absent).

              Bundle → self-contained tarball from deploy/make_bundle.sh, pulled from

              the bucket or pre-staged at <workdir>/bundle-prestage.tar.gz; nothing

              is fetched from the internet.

              '
          container_dir:
            label: Container Scratch Directory
            type: string
            default: /tmp/studio-container
            hidden: ${{ inputs.app_settings.source != 'container' }}
            tooltip: Where the image and its expanded sandbox live on the resource. Keep this on node-local
              disk, since it is derived from the image and costs nothing to recreate, while a shared filesystem
              charges for the space and extracts far more slowly.
          image_path:
            label: Container Image
            type: string
            default: /p/app/projects/hsp/cfd-training/containers/studio.sif
            optional: true
            hidden: ${{ inputs.app_settings.source != 'container' }}
            tooltip: Path to the .sif on the resource, a platform bucket URI (pw://user/bucket/studio.sif),
              or a library/docker URI the container runtime can pull. Empty looks for studio.sif in the
              work directory.
          repo_url:
            label: Repository URL
            type: string
            default: https://github.com/parallelworks/activate-studio
            hidden: ${{ inputs.app_settings.source == 'bundle' }}
            tooltip: Repository to clone. For a private repository, embed a token (https://<token>@github.com/...)
              or install a deploy key on the resource.
          git_ref:
            label: Git Ref
            type: string
            default: main
            hidden: ${{ inputs.app_settings.source == 'bundle' }}
            tooltip: Branch, tag, or commit to check out.
          rundir:
            label: Run Directory
            type: string
            default: ${PW_PARENT_JOB_DIR}
            hidden: true
          bundlebucket:
            label: Bundle Bucket
            type: bucket
            optional: true
            tooltip: Bucket holding the deployment bundle built by deploy/make_bundle.sh. If the platform
              bucket API is unavailable, pre-stage the bundle on the resource as <workdir>/bundle-prestage.tar.gz
              instead; the pull step falls back to it.
          bundle_file:
            label: Bundle File
            type: string
            default: studio-bundle.tar.gz
            tooltip: Filename of the bundle in the bucket. Bump to roll to a newer build.
          refresh_software:
            label: Load Latest Bundle
            type: boolean
            default: false
            tooltip: Clobber the cached bundle and re-pull the latest from the bucket.
          office_runtime:
            label: LibreOffice Runtime (bucket)
            type: string
            optional: true
            tooltip: Bucket path of an office-runtime.tar.gz (the official LibreOffice Linux binaries
              repacked as a relocatable directory). Pulled and cached once per host when soffice is absent,
              like the Node runtime, so Word, PowerPoint and Excel files render as pages. Leave empty
              to fall back to extracted-text previews.
          app_port:
            label: App Port
            type: number
            default: 0
            hidden: true
      kb_settings:
        label: Knowledge Base
        type: group
        collapsed: true
        items:
          kb_root:
            label: Knowledge Base Directory
            type: string
            default: ${WORKDIR:-$HOME/pw}/studio-knowledge-base
            tooltip: The directory to index and serve. Created if missing; point it at an existing corpus
              to work over it.
          index_base:
            label: Index Directory
            type: string
            default: ${WORKDIR:-$HOME/pw}/studio-index
            optional: true
            tooltip: Where the search index, settings, and credential store live. Empty keeps it inside
              the work directory; set an absolute path (e.g. a /shared location) to survive work-directory
              rebuilds.
          starter_dirs:
            label: Starter Directories
            type: string
            default: ''
            optional: true
            tooltip: Comma-separated directory names for a knowledge base that is new or empty (e.g. papers,software,datasets).
              Empty uses the default set, and a knowledge base that already holds content is never touched.
          starter_bundle:
            label: Starter Knowledge Base (bucket)
            type: string
            default: /p/app/projects/hsp/cfd-training/cfd-starter-kb.tar.gz
            optional: true
            tooltip: Tarball (bucket URI) pulled and extracted into an empty knowledge base on first launch,
              so a fresh deployment starts with a working corpus. A knowledge base that already has content
              is never touched. Scheduler placement only.
          kb_label:
            label: Knowledge Base Label
            type: string
            default: CFD Knowledge Base
            tooltip: Display name in the interface.
          mission:
            label: Mission and Context
            type: string
            optional: true
            tooltip: One short paragraph on what this Studio is for; injected into the assistant's system
              prompt and editable later in Settings.
            default: This is the CFD AI Studio, a workspace for computational fluid dynamics engineering.
              The corpus holds complete OpenFOAM tutorial cases, tutorials for running each, solver manuals,
              papers, surface geometry models, and prior chat sessions. Its purpose is helping engineers
              understand, run, and adapt CFD cases and answering questions grounded in this material.
          build_gufi:
            label: Build GUFI Index Engine
            type: boolean
            default: true
            tooltip: 'Build GUFI from the bundled source (needs cmake and a C compiler on the

              resource; takes a few minutes the first time, cached afterwards). When

              off or when the build fails, the app still runs with filesystem browsing

              and grep-backed search.

              '
          run_index:
            label: Index on Launch
            type: boolean
            default: true
            tooltip: Run the full index (metadata, text extraction, embeddings) before starting. Turn
              off for an instant relaunch on an unchanged corpus.
      model_settings:
        label: Models (optional)
        type: group
        collapsed: true
        items:
          posture:
            label: Deployment Posture
            type: dropdown
            default: single
            options:
            - label: Single user (no identity, deployment credential only)
              value: single
            - label: Multi-user, shared credential (no key collection)
              value: multi-shared
            - label: Multi-user, personal keys allowed
              value: multi-personal
            - label: Multi-user, personal keys required
              value: multi-strict
            tooltip: 'Single user runs with no platform identity and never creates the

              per-user credential store. Multi-user postures verify the platform

              identity header; shared keeps everyone on the deployment credential

              with key collection hard-disabled, personal lets users add their own

              model keys, strict requires them for chat. Multi-user postures need

              the platform host below.

              '
          platform_host:
            label: Platform Host (multi-user postures)
            type: string
            default: ''
            optional: true
            tooltip: Platform host for identity verification, e.g. activate.parallel.works; the JWKS path
              is appended automatically. Ignored for the single-user posture.
          pw_api_key:
            label: Gateway API Key
            type: string
            default: ''
            optional: true
            tooltip: OpenAI-compatible gateway credential for chat. Empty uses the pw CLI credential on
              the resource when one exists; chat is disabled otherwise, every other feature still works.
          gateway_url:
            label: Gateway Base URL
            type: string
            default: ''
            optional: true
            tooltip: Override the OpenAI-compatible endpoint base URL (defaults to the ACTIVATE platform
              gateway).
          serve:
            label: Serve a Model in the Job
            type: boolean
            default: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Scheduler placement only. Start vLLM on the job's GPUs and point the Studio at it;
              off, the Studio uses the gateway settings above.
          model_dir:
            label: Model Directory
            type: string
            default: /p/app/projects/hsp/cfd-training/models/gemma-4-31B-it-heretic
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: HuggingFace-format model directory on the resource. Empty derives <workdir>/models/<model
              id>. Downloaded on the login node when missing and a model id is set; a read-only shared
              copy is served in place, so one copy covers every user.
          hf_model_id:
            label: HuggingFace Model ID
            type: string
            default: coder3101/gemma-4-31B-it-heretic
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Downloaded into the model directory when it does not exist yet.
          hf_token:
            label: HuggingFace Token
            type: string
            default: ''
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
          served_name:
            label: Served Model Name
            type: string
            default: gemma-4-31b-it
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
          vllm_image:
            label: vLLM Image (bucket or path)
            type: string
            default: /p/app/projects/hsp/cfd-training/containers/vllm.sif
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Bucket URI or path of the vLLM Apptainer image. Staged beside the Studio image and
              cached on the resource.
          gpu_ids:
            label: GPU IDs
            type: string
            default: '0'
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: CUDA_VISIBLE_DEVICES for the model server. The Studio itself needs no GPU.
          vllm_args:
            label: vLLM Arguments
            type: string
            default: --tensor-parallel-size 1 --gpu-memory-utilization 0.92 --max-model-len 32768 --kv-cache-dtype
              fp8 --trust-remote-code --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser
              gemma4 --chat-template /vllm-workspace/examples/tool_chat_template_gemma4.jinja
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Tool-call and reasoning parsers are model-specific; a Gemma 4 model wants --tool-call-parser
              gemma4 --reasoning-parser gemma4 and its chat template, a Qwen model --tool-call-parser
              qwen3_coder --reasoning-parser qwen3.
          register_openai:
            label: Register the Model in the Catalog
            type: boolean
            default: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Also expose the served model as a platform model (pw endpoints --openai), so other
              tools can use it while the job runs.
          model_endpoint_name:
            label: Model Endpoint Name
            type: string
            default: gemma
            optional: true
            hidden: ${{ inputs.resource_and_execution.scheduler != true }}
            tooltip: Platform endpoint name for the served model. Empty derives <session name>-model.
jobs:
  setup:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
    - name: Create directories
      run: "mkdir -p ${{ inputs.app_settings.workdir }}\nmkdir -p ${{ inputs.kb_settings.kb_root }}\n\
        if [ -n \"${{ inputs.kb_settings.index_base }}\" ]; then\n  mkdir -p \"${{ inputs.kb_settings.index_base\
        \ }}\"\nfi\n"
  get_ports:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    outputs:
      APP_PORT: ${{ needs.get_ports.steps.ports.outputs.APP_PORT }}
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
    - name: Get open port
      id: ports
      run: "if [[ ${{ inputs.app_settings.app_port }} == \"0\" ]]; then\n  APP_PORT=$(pw agent open-port)\n\
        else\n  APP_PORT=${{ inputs.app_settings.app_port }}\nfi\necho \"App port: $APP_PORT\"\necho APP_PORT=$APP_PORT\
        \ >> $OUTPUTS\n"
  pull_software:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
    - setup
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
    - name: Clone and build from GitHub
      run: "if [ \"${{ inputs.session_settings.session_method }}\" = \"cleanup\" ]; then exit 0; fi\n\
        if [ \"${{ inputs.app_settings.source }}\" != \"github\" ]; then\n  echo \"Not GitHub mode; a\
        \ later step stages the image or bundle.\"\n  exit 0\nfi\ncd ${{ inputs.app_settings.workdir }}\n\
        set -e\n# A workdir node-runtime shadows the system node on PATH, so an\n# older one is discarded\
        \ rather than kept.\nnode_ok() { [ \"$(\"$1\" -p 'process.version.slice(1).split(\".\")[0]' 2>/dev/null\
        \ || echo 0)\" -ge 22 ]; }\nif [ -x node-runtime/bin/node ] && ! node_ok node-runtime/bin/node;\
        \ then\n  rm -rf node-runtime\nfi\nNEED_NODE=1\nif [ -x node-runtime/bin/node ]; then\n  NEED_NODE=0\n\
        elif command -v node >/dev/null 2>&1 && node_ok node; then\n  NEED_NODE=0\nfi\nif [ \"$NEED_NODE\"\
        \ = \"1\" ]; then\n  echo \"Fetching Node runtime...\"\n  curl -fsSL -o node.tar.xz https://nodejs.org/dist/v22.23.2/node-v22.23.2-linux-x64.tar.xz\n\
        \  mkdir -p node-runtime\n  tar -xJf node.tar.xz -C node-runtime --strip-components=1\n  rm -f\
        \ node.tar.xz\nfi\nPATH=\"$PWD/node-runtime/bin:$PATH\"; export PATH\necho \"node: $(node --version)\"\
        \nif [ -d repo/.git ]; then\n  echo \"Updating existing clone...\"\n  git -C repo fetch --all\
        \ --prune\nelse\n  # A repo dir without .git is debris (interrupted copy or failed\n  # clone);\
        \ wipe it rather than dying on a non-empty destination.\n  rm -rf repo\n  git clone \"${{ inputs.app_settings.repo_url\
        \ }}\" repo\nfi\ngit -C repo checkout -f \"${{ inputs.app_settings.git_ref }}\"\n# Hard reset\
        \ so force-pushed branches update too; a plain ff-only\n# pull fails silently after a force push\
        \ and builds a stale tree.\ngit -C repo reset --hard \"origin/${{ inputs.app_settings.git_ref\
        \ }}\" 2>/dev/null || true\necho \"building $(git -C repo rev-parse --short HEAD): $(git -C repo\
        \ log -1 --format=%s)\"\n\ncd repo\n# No corepack: its vm loader crashes on several pnpm/Node\
        \ pairings\n# and its shims linger broken across runs. A plain npm global\n# install of pnpm 11\
        \ overwrites any stale shim and just works.\nPNPM_MAJ=$(pnpm --version 2>/dev/null | cut -d. -f1\
        \ || echo 0)\nif [ \"${PNPM_MAJ:-0}\" -lt 11 ] 2>/dev/null; then\n  echo \"installing pnpm via\
        \ npm\"\n  npm install -g pnpm@11 >/dev/null 2>&1 || true\nfi\npnpm --version >/dev/null 2>&1\
        \ || { echo \"ERROR: pnpm unavailable\"; exit 1; }\necho \"pnpm: $(pnpm --version)\"\n\necho \"\
        Installing dependencies and building...\"\npnpm install --frozen-lockfile\npnpm build\n# Lay out\
        \ the same app/ tree the bundle uses, so later jobs are identical.\ncd ..\nrm -rf app\nmkdir -p\
        \ app/web\npnpm --dir repo --filter @activate-studio/server --prod deploy --legacy \"$PWD/app/server\"\
        \ncp -r repo/web/dist app/web/dist\ncp -r repo/indexer app/indexer\ncp -r repo/docs app/docs\n\
        cp -r repo/extensions-starter app/extensions-starter\nmkdir -p app/index/models cache\n# The app\
        \ tree is rebuilt from scratch each run, so the model is\n# cached beside it rather than inside\
        \ it; otherwise every update\n# re-downloads it.\nif [ ! -f cache/minilm384.gguf ]; then\n  echo\
        \ \"Fetching embedding model...\"\n  curl -fsSL -o cache/minilm384.gguf \\\n    'https://huggingface.co/asg017/sqlite-lembed-model-examples/resolve/main/all-MiniLM-L6-v2/all-MiniLM-L6-v2.e4ce9877.q8_0.gguf'\
        \ \\\n    || echo \"WARNING: model fetch failed; vector search disabled.\"\nelse\n  echo \"embedding\
        \ model already cached\"\nfi\n[ -f cache/minilm384.gguf ] && cp -f cache/minilm384.gguf app/index/models/minilm384.gguf\n\
        if [ ! -f gufi-src.tar.gz ]; then\n  echo \"Fetching GUFI source...\"\n  # GUFI's cmake runs git\
        \ describe for its version string; a shallow\n  # clone has no tags, so stamp one and keep .git\
        \ in the tarball.\n  if git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/mar-file-system/GUFI\
        \ gufi-clone; then\n    git -C gufi-clone -c user.name=deploy -c user.email=deploy@localhost tag\
        \ -a deploy-snapshot -m \"deploy snapshot\" 2>/dev/null || true\n    tar -czf gufi-src.tar.gz\
        \ --transform 's|^gufi-clone|GUFI|' gufi-clone\n  else\n    echo \"WARNING: GUFI source fetch\
        \ failed; index engine unavailable.\"\n  fi\n  rm -rf gufi-clone\nfi\necho \"github\" > .bundle\n"
    - name: Pull and unpack the bundle
      run: "if [ \"${{ inputs.session_settings.session_method }}\" = \"cleanup\" ]; then\n  echo \"Cleanup\
        \ run; nothing to pull.\"\n  exit 0\nfi\nif [ \"${{ inputs.app_settings.source }}\" = \"github\"\
        \ ]; then\n  echo \"GitHub mode; app already built in the previous step.\"\n  exit 0\nfi\nif [\
        \ \"${{ inputs.app_settings.source }}\" = \"container\" ]; then\n  CDIR=\"${{ inputs.app_settings.container_dir\
        \ }}\"\n  [ -n \"$CDIR\" ] || CDIR=\"${{ inputs.app_settings.workdir }}\"\n  mkdir -p \"$CDIR\"\
        \ || { echo \"ERROR: cannot create $CDIR\"; exit 1; }\n  cd \"$CDIR\"\n  IMG=\"${{ inputs.app_settings.image_path\
        \ }}\"\n  [ -n \"$IMG\" ] || IMG=\"$PWD/studio.sif\"\n  command -v apptainer >/dev/null 2>&1 ||\
        \ command -v singularity >/dev/null 2>&1 || \\\n    { echo \"ERROR: neither apptainer nor singularity\
        \ is on the resource\"; exit 1; }\n  RUNTIME=\"$(command -v apptainer || command -v singularity)\"\
        \n  case \"$IMG\" in\n    pw://*|s3://*|gs://*|az://*)\n      # Platform buckets are not something\
        \ the container runtime\n      # can pull; stage through the CLI instead.\n      echo \"Staging\
        \ image from bucket: $IMG\"\n      # The CLI draws a carriage-return progress bar, which the\n\
        \      # platform log viewer renders as one endless line; keep the\n      # transcript readable\
        \ and surface only the outcome.\n      pw buckets cp \"$IMG\" \"$PWD/studio.sif\" > bucket-cp.log\
        \ 2>&1 \\\n        || { echo \"ERROR: bucket copy failed\"; tr '\\r' '\\n' < bucket-cp.log | tail\
        \ -3; exit 1; }\n      echo \"staged image: $(du -h \"$PWD/studio.sif\" | cut -f1)\"\n      IMG=\"\
        $PWD/studio.sif\" ;;\n    *://*)\n      echo \"Pulling image $IMG ...\"\n      \"$RUNTIME\" pull\
        \ -F \"$PWD/studio.sif\" \"$IMG\" || { echo \"ERROR: image pull failed\"; exit 1; }\n      IMG=\"\
        $PWD/studio.sif\" ;;\n  esac\n  [ -f \"$IMG\" ] || { echo \"ERROR: container image not found:\
        \ $IMG\"; exit 1; }\n  # A SIF is a squashfs image, and some login nodes run kernels\n  # without\
        \ squashfs (and without squashfuse or the privileges to\n  # load the module). Where the runtime\
        \ cannot mount the image,\n  # expand it once into a sandbox directory and run from that;\n  #\
        \ unsquashfs needs no kernel support. Cached against the image's\n  # timestamp so a rerun does\
        \ not repeat the extraction.\n  if \"$RUNTIME\" exec \"$IMG\" true 2>/dev/null; then\n    echo\
        \ \"$IMG\" > .image\n  else\n    echo \"Runtime cannot mount the image directly (no squashfs);\
        \ expanding to a sandbox.\"\n    command -v unsquashfs >/dev/null 2>&1 || { echo \"ERROR: no squashfs\
        \ support and unsquashfs is unavailable\"; exit 1; }\n    if [ -d sandbox ] && [ -f .sandbox-src\
        \ ] && [ \"$(cat .sandbox-src)\" = \"$IMG:$(stat -c %Y \"$IMG\")\" ]; then\n      echo \"Sandbox\
        \ already expanded from this image.\"\n    else\n      FS_ID=$(\"$RUNTIME\" sif list \"$IMG\"\
        \ | awk -F'|' '$5 ~ /Squashfs/ { gsub(/ /, \"\", $1); print $1; exit }')\n      [ -n \"$FS_ID\"\
        \ ] || { echo \"ERROR: no squashfs partition found in $IMG\"; exit 1; }\n      rm -rf sandbox\
        \ rootfs.squash\n      \"$RUNTIME\" sif dump \"$FS_ID\" \"$IMG\" > rootfs.squash || { echo \"\
        ERROR: could not read the image partition\"; exit 1; }\n      # -no-xattrs: the destination is\
        \ often a filesystem that\n      # refuses them, and nothing in the image depends on them.\n \
        \     unsquashfs -q -f -no-xattrs -d sandbox rootfs.squash || { echo \"ERROR: sandbox expansion\
        \ failed\"; exit 1; }\n      rm -f rootfs.squash\n      echo \"$IMG:$(stat -c %Y \"$IMG\")\" >\
        \ .sandbox-src\n    fi\n    echo \"$PWD/sandbox\" > .image\n    # The image itself is no longer\
        \ needed once expanded, and on a\n    # shared filesystem it is pure cost.\n    case \"${{ inputs.app_settings.image_path\
        \ }}\" in\n      *://*) rm -f \"$IMG\" ;;\n    esac\n  fi\n  cp .image \"${{ inputs.app_settings.workdir\
        \ }}/.image\"\n  echo \"container: $(cat .image) ($(\"$RUNTIME\" --version))\"\n  exit 0\nfi\n\
        cd ${{ inputs.app_settings.workdir }}\nBUNDLE=\"${{ inputs.app_settings.bundle_file }}\"\nif [[\
        \ -d app && \"$(cat .bundle 2>/dev/null)\" == \"$BUNDLE\" && \"${{ inputs.app_settings.refresh_software\
        \ }}\" == \"false\" ]]; then\n  echo \"Bundle ($BUNDLE) already unpacked.\"\nelse\n  echo \"Pulling\
        \ bundle $BUNDLE ...\"\n  # Bucket inputs interpolate as objects; .uri is required (the bare\n\
        \  # form injects JSON and the copy fails silently).\n  pw buckets cp \"${{ inputs.app_settings.bundlebucket.uri\
        \ }}/$BUNDLE\" ./bundle.tar.gz > bucket-cp.log 2>&1 || {\n    tr '\\r' '\\n' < bucket-cp.log |\
        \ tail -3\n    if [ -f bundle-prestage.tar.gz ]; then\n      echo \"Bucket pull failed; using\
        \ pre-staged bundle-prestage.tar.gz\"\n      cp bundle-prestage.tar.gz bundle.tar.gz\n    else\n\
        \      echo \"ERROR: bundle pull failed and no pre-staged bundle found\"; exit 1\n    fi\n  }\n\
        \  rm -rf app node-* gufi-src.tar.gz\n  tar -xzf bundle.tar.gz\n  rm -f bundle.tar.gz\n  echo\
        \ \"$BUNDLE\" > .bundle\nfi\n# Node runtime from the bundle, unless the resource has v22+.\nNEED_NODE=1\n\
        if [ -x node-runtime/bin/node ]; then\n  NEED_NODE=0\nelif command -v node >/dev/null 2>&1; then\n\
        \  MAJ=$(node -p 'process.version.slice(1).split(\".\")[0]' 2>/dev/null || echo 0)\n  [ \"$MAJ\"\
        \ -ge 22 ] && NEED_NODE=0\nfi\nif [ \"$NEED_NODE\" = \"1\" ]; then\n  NODE_TAR=$(ls node-*-linux-x64.tar.xz\
        \ 2>/dev/null | head -1)\n  if [ -n \"$NODE_TAR\" ]; then\n    mkdir -p node-runtime\n    tar\
        \ -xJf \"$NODE_TAR\" -C node-runtime --strip-components=1\n  fi\nfi\nPATH=\"$PWD/node-runtime/bin:$PATH\"\
        ; export PATH\necho \"node: $(command -v node) $(node --version 2>/dev/null || echo 'MISSING')\"\
        \n"
    - name: Office rendering runtime when soffice is absent
      run: "cd ${{ inputs.app_settings.workdir }}\nRT_URI=\"${{ inputs.app_settings.office_runtime }}\"\
        \nif [ -z \"$RT_URI\" ]; then echo \"No office runtime configured.\"; exit 0; fi\nif command -v\
        \ soffice >/dev/null 2>&1; then echo \"System soffice present; staged runtime not needed.\"; exit\
        \ 0; fi\nSOFFICE=\"$(find \"$PWD/office-runtime\" -name soffice -path \"*/program/*\" 2>/dev/null\
        \ | head -1)\"\nif [ -z \"$SOFFICE\" ]; then\n  PW_BIN=\"$(command -v pw || echo pw)\"\n  \"$PW_BIN\"\
        \ buckets cp \"$RT_URI\" office-runtime.tar.gz || { echo \"office runtime pull failed; office\
        \ rendering stays unavailable.\"; exit 0; }\n  tar -xzf office-runtime.tar.gz && rm -f office-runtime.tar.gz\n\
        \  SOFFICE=\"$(find \"$PWD/office-runtime\" -name soffice -path \"*/program/*\" | head -1)\"\n\
        fi\n[ -n \"$SOFFICE\" ] || { echo \"no soffice in the runtime; office rendering stays unavailable.\"\
        ; exit 0; }\nprintf '#!/bin/bash\\nexec \"%s\" \"$@\"\\n' \"$SOFFICE\" > soffice-wrapper.sh\n\
        chmod +x soffice-wrapper.sh\necho \"Office rendering via staged runtime: $SOFFICE\"\n"
  build_gufi:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
    - pull_software
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
    - name: Python environment for document extraction
      run: "if [ \"${{ inputs.session_settings.session_method }}\" = \"cleanup\" ]; then exit 0; fi\n\
        if [ \"${{ inputs.app_settings.source }}\" = \"container\" ]; then\n  echo \"Container mode; the\
        \ image carries the extractors.\"\n  exit 0\nfi\ncd ${{ inputs.app_settings.workdir }}\n# Word,\
        \ PowerPoint and Excel files index as their filename alone\n# without these. The indexer has a\
        \ standard-library fallback, but\n# the libraries read the documents properly, so install them\
        \ once\n# into a venv beside the app and point the indexer at it.\nPY=\"\"\nfor cand in python3.13\
        \ python3.12 python3.11 python3.10 python3; do\n  if command -v \"$cand\" >/dev/null 2>&1 && \"\
        $cand\" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)' 2>/dev/null; then\n\
        \    PY=\"$cand\"; break\n  fi\ndone\nif [ -z \"$PY\" ]; then\n  echo \"WARNING: no python 3.10+\
        \ found; extraction falls back to the standard library.\"\n  exit 0\nfi\nif [ ! -x pyenv/bin/python\
        \ ]; then\n  \"$PY\" -m venv pyenv || echo \"WARNING: could not create the venv\"\nfi\nif [ -x\
        \ pyenv/bin/python ]; then\n  ./pyenv/bin/python -m pip install --quiet --upgrade pip 2>/dev/null\
        \ || true\n  ./pyenv/bin/python -m pip install --quiet python-docx python-pptx openpyxl \\\n \
        \   || echo \"WARNING: could not install the extractors (no network?); the standard-library fallback\
        \ applies.\"\n  ./pyenv/bin/python - <<'CHECK'\nmods = []\nfor name, label in (('docx', 'python-docx'),\
        \ ('pptx', 'python-pptx'), ('openpyxl', 'openpyxl')):\n    try:\n        __import__(name)\n  \
        \      mods.append(f'{label} ok')\n    except ImportError:\n        mods.append(f'{label} MISSING')\n\
        print('document extraction:', ', '.join(mods))\nCHECK\nfi\n"
    - name: Build GUFI from bundled source
      run: "if [ \"${{ inputs.session_settings.session_method }}\" = \"cleanup\" ]; then exit 0; fi\n\
        if [ \"${{ inputs.app_settings.source }}\" = \"container\" ]; then\n  echo \"Container mode; GUFI\
        \ ships inside the image.\"\n  exit 0\nfi\nif [ \"${{ inputs.kb_settings.build_gufi }}\" != \"\
        true\" ]; then\n  echo \"GUFI build disabled; the app will run with filesystem browsing and grep\
        \ search.\"\n  exit 0\nfi\ncd ${{ inputs.app_settings.workdir }}\nif [ -x gufi-install/bin/gufi_query\
        \ ]; then\n  echo \"GUFI already built.\"\n  exit 0\nfi\nif ! command -v cmake >/dev/null 2>&1;\
        \ then\n  module load cmake 2>/dev/null || true\nfi\nif ! command -v cmake >/dev/null 2>&1; then\n\
        \  echo \"WARNING: cmake not available; skipping GUFI build. The app degrades gracefully.\"\n\
        \  exit 0\nfi\nrm -rf GUFI\ntar -xzf gufi-src.tar.gz\n# llama.cpp (vendored for the embedding\
        \ layer) defaults to\n# -march=native; older assemblers reject the AVX-VNNI instructions\n# new\
        \ CPUs advertise (seen as vpdpbusd errors). Build it portable.\nsed -i 's/-DGGML_CCACHE=Off/-DGGML_CCACHE=Off\
        \ -DGGML_NATIVE=Off/' GUFI/contrib/deps/sqlite-lembed.sh 2>/dev/null || true\nmkdir -p GUFI/build\n\
        cd GUFI/build\n# SERVER_CONFIG/CLIENT_CONFIG default under /etc/GUFI and the\n# completion script\
        \ installs to /etc/bash_completion.d; neither is\n# writable without root, so keep config in the\
        \ prefix and skip\n# the completion install.\nGUFI_PREFIX=\"${{ inputs.app_settings.workdir }}/gufi-install\"\
        \ncmake .. -DCMAKE_INSTALL_PREFIX=\"$GUFI_PREFIX\" -DCMAKE_BUILD_TYPE=Release \\\n  -DSERVER_CONFIG=\"\
        $GUFI_PREFIX/etc/server\" -DCLIENT_CONFIG=\"$GUFI_PREFIX/etc/client\" \\\n  -DBASH_COMPLETION=Off\
        \ \\\n  || { echo \"WARNING: cmake configure failed; continuing without GUFI\"; exit 0; }\nmake\
        \ -j \"$(nproc)\" || { echo \"WARNING: GUFI build failed; continuing without GUFI\"; exit 0; }\n\
        make install || { echo \"WARNING: GUFI install failed; continuing without GUFI\"; exit 0; }\n\
        echo \"GUFI installed at ${{ inputs.app_settings.workdir }}/gufi-install\"\n"
  index_kb:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
    - build_gufi
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
    - name: Index the knowledge base
      run: "if [ \"${{ inputs.session_settings.session_method }}\" = \"cleanup\" ]; then exit 0; fi\n\
        if [ \"${{ inputs.kb_settings.run_index }}\" != \"true\" ]; then\n  echo \"Indexing on launch\
        \ disabled.\"\n  exit 0\nfi\nif [ \"${{ inputs.app_settings.source }}\" = \"container\" ]; then\n\
        \  echo \"Container mode; the image indexes on start (INDEX_ON_START).\"\n  exit 0\nfi\ncd ${{\
        \ inputs.app_settings.workdir }}\nif [ ! -x gufi-install/bin/gufi_dir2index ]; then\n  echo \"\
        GUFI not present; skipping index build (search falls back to grep).\"\n  exit 0\nfi\nexport KB_ROOT=\"\
        ${{ inputs.kb_settings.kb_root }}\"\nexport GUFI_BIN=\"$PWD/gufi-install/bin\"\nexport INDEX_BASE=\"\
        ${{ inputs.kb_settings.index_base }}\"\n[ -n \"$INDEX_BASE\" ] || INDEX_BASE=\"$PWD/app/index\"\
        \nexport INDEX_BASE\n# Document extraction runs under the venv when one was built.\nif [ -x pyenv/bin/python\
        \ ]; then export PYTHON_BIN=\"$PWD/pyenv/bin/python\"; fi\n# The embedding model ships inside\
        \ the app tree; a relocated index\n# needs it at $INDEX_BASE/models.\nif [ \"$INDEX_BASE\" !=\
        \ \"$PWD/app/index\" ] && [ ! -f \"$INDEX_BASE/models/minilm384.gguf\" ] && [ -f app/index/models/minilm384.gguf\
        \ ]; then\n  mkdir -p \"$INDEX_BASE/models\"\n  cp app/index/models/minilm384.gguf \"$INDEX_BASE/models/\"\
        \nfi\nbash app/indexer/reindex.sh || echo \"WARNING: index build failed; the app still serves\
        \ the filesystem.\"\n"
  run_app:
    if: ${{ inputs.resource_and_execution.scheduler != true }}
    needs:
    - index_kb
    - get_ports
    ssh:
      remoteHost: ${{ inputs.resource_and_execution.resource.ip }}
    steps:
    - name: Stop dangling processes from a prior launch
      run: "cd ${{ inputs.app_settings.workdir }}\n# The watchdog dies first so it cannot resurrect what\
        \ follows.\n# The pid file is best effort; the sweep below catches watchdogs\n# whose pid file\
        \ is stale or was written wrong.\nif [ -f watchdog.pid ]; then\n  kill \"$(cat watchdog.pid)\"\
        \ 2>/dev/null || true\n  rm -f watchdog.pid\nfi\nfor p in $(pgrep -f \"bash watchdog[.]sh\" 2>/dev/null);\
        \ do\n  [ \"$(readlink /proc/$p/cwd 2>/dev/null)\" = \"$PWD\" ] && kill -9 \"$p\" 2>/dev/null\
        \ && echo \"  swept stale watchdog $p\"\ndone\nif [ -f app-custom.pids ]; then\n  echo \"Stopping\
        \ processes from a prior launch:\"; cat app-custom.pids || true\n  while read -r p; do\n    [\
        \ -n \"$p\" ] || continue\n    kill \"$p\" 2>/dev/null || true\n    kill -- -\"$p\" 2>/dev/null\
        \ || true\n  done < app-custom.pids\nfi\n: > app-custom.pids\n# Sweep by pattern too, scoped so\
        \ other deployments on the node\n# survive: studio servers are matched by working directory, the\n\
        # endpoint agent by this deployment's session name.\nfor p in $(pgrep -f \"app/server/dist/main[.]js\"\
        \ 2>/dev/null); do\n  [ \"$(readlink /proc/$p/cwd 2>/dev/null)\" = \"$PWD\" ] && kill \"$p\" 2>/dev/null\
        \ && echo \"  swept stale server $p\"\ndone\nPREFIX=\"$(echo \"${{ inputs.session_settings.session_name\
        \ }}\" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')\"\
        \n[ -n \"$PREFIX\" ] || PREFIX=\"studio\"\npkill -f \"endpoints http.*--name ${PREFIX}\" 2>/dev/null\
        \ && echo \"  swept stale endpoint agent (${PREFIX})\" || true\n"
    - name: Generate run_app.sh
      run: "RUNDIR=\"${{ inputs.app_settings.rundir }}\"\nWORKDIR=\"${{ inputs.app_settings.workdir }}\"\
        \nSCRIPT=\"${RUNDIR}/run_app.sh\"\nmkdir -p ${RUNDIR}\n\ncat > ${SCRIPT} << 'SCRIPT_HEADER'\n\
        #!/bin/bash\nexport PATH=\"$HOME/.local/bin:$HOME/pw:$PATH\"\nhostname; date; pwd\nSCRIPT_HEADER\n\
        \necho \"pushd ${WORKDIR}\" >> ${SCRIPT}\necho \"export PATH=\\\"${WORKDIR}/node-runtime/bin:\\\
        $PATH\\\"\" >> ${SCRIPT}\necho \"export PORT=${{ needs.get_ports.outputs.APP_PORT }}\" >> ${SCRIPT}\n\
        echo \"export KB_ROOT=${{ inputs.kb_settings.kb_root }}\" >> ${SCRIPT}\necho \"export KB_LABEL='${{\
        \ inputs.kb_settings.kb_label }}'\" >> ${SCRIPT}\n# The mission is free text; a quoted heredoc\
        \ plus %q survives any\n# quoting the operator types (apostrophes included).\nKB_MISSION_TEXT=$(cat\
        \ << 'MISSION_EOF'\n${{ inputs.kb_settings.mission }}\nMISSION_EOF\n)\nprintf 'export KB_MISSION=%q\\\
        n' \"$KB_MISSION_TEXT\" >> ${SCRIPT}\necho \"export GUFI_BIN=${WORKDIR}/gufi-install/bin\" >>\
        \ ${SCRIPT}\nif [ -x \"${WORKDIR}/soffice-wrapper.sh\" ]; then\n  echo \"export SOFFICE_BIN=${WORKDIR}/soffice-wrapper.sh\"\
        \ >> ${SCRIPT}\nfi\nif [ -x \"${WORKDIR}/pyenv/bin/python\" ]; then\n  echo \"export PYTHON_BIN=${WORKDIR}/pyenv/bin/python\"\
        \ >> ${SCRIPT}\nfi\nif [ -n \"${{ inputs.kb_settings.index_base }}\" ]; then\n  echo \"export\
        \ INDEX_BASE='${{ inputs.kb_settings.index_base }}'\" >> ${SCRIPT}\nelse\n  echo \"export INDEX_BASE=${WORKDIR}/app/index\"\
        \ >> ${SCRIPT}\nfi\necho \"export APP_NAME='${{ inputs.app_settings.app_name }}'\" >> ${SCRIPT}\n\
        if [ -n \"${{ inputs.app_settings.banner_text }}\" ]; then\n  echo \"export BANNER_TEXT='${{ inputs.app_settings.banner_text\
        \ }}'\" >> ${SCRIPT}\nfi\nif [ -n \"${{ inputs.app_settings.banner_color }}\" ]; then\n  echo\
        \ \"export BANNER_COLOR='${{ inputs.app_settings.banner_color }}'\" >> ${SCRIPT}\nfi\nif [ -n\
        \ \"${{ inputs.kb_settings.starter_dirs }}\" ]; then\n  echo \"export KB_STARTER_DIRS='${{ inputs.kb_settings.starter_dirs\
        \ }}'\" >> ${SCRIPT}\nfi\nif [ -n \"${{ inputs.app_settings.icon_path }}\" ]; then\n  echo \"\
        export APP_ICON='${{ inputs.app_settings.icon_path }}'\" >> ${SCRIPT}\nfi\nPROMPTS='${{ inputs.app_settings.suggested_prompts\
        \ }}'\nif [ -n \"$PROMPTS\" ]; then\n  JSON=\"[\"\n  IFS=';'\n  first=1\n  for q in $PROMPTS;\
        \ do\n    q=$(echo \"$q\" | xargs | sed 's/\\\\/\\\\\\\\/g; s/\"/\\\\\"/g')\n    [ -n \"$q\" ]\
        \ || continue\n    [ \"$first\" = \"1\" ] && first=0 || JSON=\"$JSON,\"\n    JSON=\"$JSON\\\"\
        $q\\\"\"\n  done\n  unset IFS\n  JSON=\"$JSON]\"\n  echo \"export SUGGESTED_PROMPTS='$JSON'\"\
        \ >> ${SCRIPT}\nfi\nif [ -n \"${{ inputs.model_settings.pw_api_key }}\" ]; then\n  echo \"export\
        \ PW_API_KEY='${{ inputs.model_settings.pw_api_key }}'\" >> ${SCRIPT}\nfi\nif [ -n \"${{ inputs.model_settings.gateway_url\
        \ }}\" ]; then\n  echo \"export PW_GATEWAY_URL='${{ inputs.model_settings.gateway_url }}'\" >>\
        \ ${SCRIPT}\nfi\nPOSTURE='${{ inputs.model_settings.posture }}'\nPLATFORM_HOST='${{ inputs.model_settings.platform_host\
        \ }}'\nif [ \"$POSTURE\" != \"single\" ] && [ -n \"$PLATFORM_HOST\" ]; then\n  echo \"export AUTH_JWKS_URL='https://${PLATFORM_HOST}/api/platform/keys'\"\
        \ >> ${SCRIPT}\n  echo \"export AUTH_ISSUER='pw-session-proxy'\" >> ${SCRIPT}\nfi\nif [ \"$POSTURE\"\
        \ = \"multi-shared\" ]; then\n  echo \"export DISABLE_PERSONAL_KEYS=1\" >> ${SCRIPT}\nfi\nif [\
        \ \"$POSTURE\" = \"multi-strict\" ]; then\n  echo \"export REQUIRE_PERSONAL_KEY=1\" >> ${SCRIPT}\n\
        fi\n\nif [ \"${{ inputs.session_settings.session_method }}\" = \"cleanup\" ]; then\n  cat >> ${SCRIPT}\
        \ << 'CLEANUP_BODY'\necho \"CLEANUP RUN: stopping all Studio processes from prior launches on\
        \ this node.\"\nif [ -f app-custom.pids ]; then\n  while read -r p; do [ -n \"$p\" ] && kill \"\
        $p\" 2>/dev/null && echo \"  killed $p\"; done < app-custom.pids\n  : > app-custom.pids\nfi\n\
        for pat in \"server/dist/main[.]js\" \"pw endpoints http.*studio\"; do\n  pkill -f \"$pat\" 2>/dev/null\
        \ && echo \"  killed by pattern: $pat\"\ndone\necho \"cleanup complete\"\nCLEANUP_BODY\n  cat\
        \ ${SCRIPT}\n  exit 0\nfi\n\nif [ \"${{ inputs.app_settings.source }}\" = \"container\" ]; then\n\
        \  echo \"export INDEX_ON_START=${{ inputs.kb_settings.run_index }}\" >> ${SCRIPT}\n  cat >> ${SCRIPT}\
        \ << 'CONTAINER_LAUNCH'\nIMG=\"$(cat .image 2>/dev/null)\"\nRUNTIME=\"$(command -v apptainer ||\
        \ command -v singularity)\"\necho \"Starting Studio container on port ${PORT} over ${KB_ROOT}\
        \ ...\"\n# The corpus and all writable state stay on the host; the image is\n# read-only. DATA_DIR\
        \ holds the index, settings, and credentials.\nsetsid nohup \"$RUNTIME\" run \\\n  --env PORT=\"\
        ${PORT}\" --env KB_ROOT=\"${KB_ROOT}\" --env DATA_DIR=\"${INDEX_BASE}\" \\\n  --env INDEX_BASE=\"\
        ${INDEX_BASE}\" --env KB_LABEL=\"${KB_LABEL}\" \\\n  --env APP_NAME=\"${APP_NAME}\" --env INDEX_ON_START=\"\
        ${INDEX_ON_START}\" \\\n  ${KB_STARTER_DIRS:+--env KB_STARTER_DIRS=\"${KB_STARTER_DIRS}\"} \\\n\
        \  ${BANNER_TEXT:+--env BANNER_TEXT=\"${BANNER_TEXT}\"} \\\n  ${BANNER_COLOR:+--env BANNER_COLOR=\"\
        ${BANNER_COLOR}\"} \\\n  ${APP_ICON:+--env APP_ICON=\"${APP_ICON}\"} \\\n  ${SUGGESTED_PROMPTS:+--env\
        \ SUGGESTED_PROMPTS=\"${SUGGESTED_PROMPTS}\"} \\\n  ${PW_API_KEY:+--env PW_API_KEY=\"${PW_API_KEY}\"\
        } \\\n  ${PW_GATEWAY_URL:+--env PW_GATEWAY_URL=\"${PW_GATEWAY_URL}\"} \\\n  ${AUTH_JWKS_URL:+--env\
        \ AUTH_JWKS_URL=\"${AUTH_JWKS_URL}\"} \\\n  ${AUTH_ISSUER:+--env AUTH_ISSUER=\"${AUTH_ISSUER}\"\
        } \\\n  ${DISABLE_PERSONAL_KEYS:+--env DISABLE_PERSONAL_KEYS=\"${DISABLE_PERSONAL_KEYS}\"} \\\n\
        \  ${REQUIRE_PERSONAL_KEY:+--env REQUIRE_PERSONAL_KEY=\"${REQUIRE_PERSONAL_KEY}\"} \\\n  --bind\
        \ \"${KB_ROOT}:${KB_ROOT}\" --bind \"${INDEX_BASE}:${INDEX_BASE}\" \\\n  \"$IMG\" > app.log 2>&1\
        \ < /dev/null &\nCONTAINER_LAUNCH\nelse\n  cat >> ${SCRIPT} << 'APP_LAUNCH'\necho \"Starting Studio\
        \ server on port ${PORT} over ${KB_ROOT} ...\"\nsetsid nohup node app/server/dist/main.js > app.log\
        \ 2>&1 < /dev/null &\nAPP_LAUNCH\nfi\ncat >> ${SCRIPT} << 'APP_LAUNCH'\necho \"$!\" >> app-custom.pids\n\
        echo \"Server forked; logs: $(pwd)/app.log\"\nfor i in $(seq 1 60); do\n  (exec 3<>/dev/tcp/127.0.0.1/${PORT})\
        \ 2>/dev/null && { exec 3>&- 3<&-; echo \"app listening after ~$(( (i-1) * 2 ))s\"; break; }\n\
        \  sleep 2\ndone\nif [ \"${{ inputs.session_settings.session_method }}\" = \"web\" ]; then\n \
        \ PREFIX=\"$(echo \"${{ inputs.session_settings.session_name }}\" | tr '[:upper:]' '[:lower:]'\
        \ | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')\"\n  [ -n \"$PREFIX\" ] || PREFIX=\"\
        studio\"\n  if [ \"${{ inputs.session_settings.unique_suffix }}\" = \"true\" ]; then\n    EP_NAME=\"\
        ${PREFIX}-${PORT}\"\n  else\n    EP_NAME=\"${PREFIX}\"\n  fi\n  PW_BIN=\"$(command -v pw || echo\
        \ pw)\"\n  echo \"Forking web endpoint ${EP_NAME} -> localhost:${PORT}; log: $(pwd)/endpoint.log\"\
        \n  # --keep leaves the session registered when this process exits, so the\n  # URL people have\
        \ been given keeps resolving across a relaunch.\n  setsid nohup \"$PW_BIN\" endpoints http -o\
        \ text --keep --name \"$EP_NAME\" --subdomain \"$EP_NAME\" \"$PORT\" > endpoint.log 2>&1 < /dev/null\
        \ &\n  echo \"$!\" >> app-custom.pids\n  echo \"$!\" > agent.pid\n  # Watchdog: if the app stops\
