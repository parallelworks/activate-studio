# Unmute (Kyutai) as a voice front end: speech recognition, semantic
# turn-taking, and speech synthesis around a conversational model that is
# a configuration value, not a hosted service. Point it at a Studio and
# the voice gets the corpus, tools and workflows with an API model behind
# it (studio-voice/<gateway-model-id>); point it at the gateway and it is
# a plain conversation with that model. Only the speech services need a
# GPU: about 5.3 GB for synthesis and 2.5 GB for recognition, which may
# sit on different cards. Runs the upstream docker compose with the
# bundled LLM disabled and publishes the interface as a platform session.
# Feature preview; verified on a two-GPU node.
permissions:
  - '*'
'on':
  execute:
    inputs:
      resource:
        label: GPU system
        type: compute-clusters
        autoselect: true
        optional: false
        tooltip: A Linux x86_64 node with one GPU of 16 GB or more (STT about 2.5 GB, TTS about 5.3 GB) and Docker with the NVIDIA runtime.
      studio:
        type: group
        label: Studio
        items:
          v1_url:
            label: Model base URL
            type: string
            optional: false
            tooltip: "Where the conversational model lives, WITHOUT the /v1 suffix: Unmute appends it. A Studio (https://my-studio.example) puts the corpus, tools and workflows behind the voice; the platform gateway (https://activate.parallel.works/api/openai) is the shortest path to a plain conversation."
          api_key:
            label: Studio API key
            type: string
            optional: false
            tooltip: A platform token or API key the Studio accepts on /v1.
          model:
            label: Model
            type: string
            default: studio-voice
            tooltip: "Against a Studio: studio-voice is the assistant with its tools and grounding, answering in spoken sentences, and studio-voice/<gateway-model-id> names the model behind it (an API model such as a Sol or Gemini id). Against the gateway directly: the model id itself."
      unmute:
        type: group
        label: Unmute
        items:
          repo:
            label: Repository
            type: string
            default: https://github.com/kyutai-labs/unmute.git
          ref:
            label: Git ref
            type: string
            default: main
          hf_token:
            label: Hugging Face token
            type: string
            optional: true
            tooltip: Optional. The Kyutai STT and TTS weights and the stock voices download without one; a token is only needed for gated or private voice repositories.
          stt_gpu:
            label: GPU index for speech recognition
            type: string
            default: "0"
            tooltip: The NVIDIA device index the STT service is pinned to (about 2.5 GB).
          tts_gpu:
            label: GPU index for speech synthesis
            type: string
            default: "0"
            tooltip: The NVIDIA device index the TTS service is pinned to (about 5.3 GB). Use a second index to split the two across cards.
          session_name:
            label: Session name
            type: string
            default: unmute
          workdir:
            label: Working directory
            type: string
            default: ~/unmute-work
jobs:
  deploy:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Fetch Unmute
        run: |
          set -e
          mkdir -p ${{ inputs.unmute.workdir }} && cd ${{ inputs.unmute.workdir }}
          if [ ! -d unmute ]; then git clone --depth 1 --branch "${{ inputs.unmute.ref }}" "${{ inputs.unmute.repo }}" unmute; fi
          cd unmute && git fetch --depth 1 origin "${{ inputs.unmute.ref }}" && git checkout -q FETCH_HEAD
          command -v docker >/dev/null || { echo "docker is required on the node"; exit 1; }
          docker info 2>/dev/null | grep -qi nvidia || echo "warning: no NVIDIA runtime reported by docker; STT and TTS will not start without it"
      - name: Point the backend at the Studio and drop the bundled LLM
        run: |
          set -e
          cd ${{ inputs.unmute.workdir }}/unmute
          # The image's start script logs into Hugging Face unconditionally and
          # dies on an empty token; the weights are public, so the login is
          # made optional here. The cargo build of moshi-server is kept in a
          # named volume so only the first start compiles it.
          cat > start_moshi_server_studio.sh << 'EOF3'
          #!/bin/bash
          set -ex
          export LD_LIBRARY_PATH=$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          if [ -n "$HUGGING_FACE_HUB_TOKEN" ]; then uvx hf auth login --token "$HUGGING_FACE_HUB_TOKEN"; fi
          CARGO_TARGET_DIR=/app/target cargo install --features cuda moshi-server@0.6.4
          /root/.cargo/bin/moshi-server "$@"
          EOF3
          chmod +x start_moshi_server_studio.sh
          # Verified on a two-GPU host: the NVIDIA container runtime with explicit
          # device ids, not CDI names, which failed there on a stale device spec.
          cat > docker-compose.studio.yml << 'EOF2'
          services:
            backend:
              environment:
                KYUTAI_LLM_URL: ${STUDIO_V1_URL}
                KYUTAI_LLM_MODEL: ${STUDIO_MODEL:-studio-voice}
                KYUTAI_LLM_API_KEY: ${STUDIO_API_KEY:-none}
              extra_hosts:
                - "host.docker.internal:host-gateway"
              depends_on: !override
                - stt
                - tts
            llm:
              profiles: ["disabled"]
            stt:
              entrypoint: ["uv", "run", "--locked", "--project", "./moshi-server", "./start_moshi_server_studio.sh"]
              volumes:
                - ./start_moshi_server_studio.sh:/app/start_moshi_server_studio.sh:ro
                - moshi-target:/app/target
              deploy:
                resources:
                  reservations:
                    devices: !override
                      - driver: nvidia
                        device_ids: ["${STT_GPU:-0}"]
                        capabilities: [gpu]
            tts:
              entrypoint: ["uv", "run", "--locked", "--project", "./moshi-server", "./start_moshi_server_studio.sh"]
              volumes:
                - ./start_moshi_server_studio.sh:/app/start_moshi_server_studio.sh:ro
                - moshi-target:/app/target
              deploy:
                resources:
                  reservations:
                    devices: !override
                      - driver: nvidia
                        device_ids: ["${TTS_GPU:-0}"]
                        capabilities: [gpu]
            traefik:
              ports: !override
                - "${UNMUTE_PORT:-80}:80"
          volumes:
            moshi-target:
          EOF2
          {
            echo "STUDIO_V1_URL=${{ inputs.studio.v1_url }}"
            echo "STUDIO_MODEL=${{ inputs.studio.model }}"
            echo "STUDIO_API_KEY=${{ inputs.studio.api_key }}"
            echo "HUGGING_FACE_HUB_TOKEN=${{ inputs.unmute.hf_token }}"
            echo "STT_GPU=${{ inputs.unmute.stt_gpu }}"
            echo "TTS_GPU=${{ inputs.unmute.tts_gpu }}"
          } > .env.studio
          chmod 600 .env.studio
      - name: Build the images
        run: |
          set -e
          cd ${{ inputs.unmute.workdir }}/unmute
          docker compose --env-file .env.studio -f docker-compose.yml -f docker-compose.studio.yml build
      - name: Serve Unmute as a platform session
        run: |
          set -e
          cd ${{ inputs.unmute.workdir }}/unmute
          # The endpoint agent hands this command a free port in PORT; traefik
          # publishes on it, and the agent tunnels it to the session URL.
          pw endpoints run --name "${{ inputs.unmute.session_name }}" --subdomain "${{ inputs.unmute.session_name }}" -- \
            bash -c 'UNMUTE_PORT="$PORT" docker compose --env-file .env.studio -f docker-compose.yml -f docker-compose.studio.yml up --abort-on-container-exit'
