<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The macOS app's icon, on Apple's icon grid: an 824-pixel rounded
       square centered on a 1024 canvas, with a soft shadow below it, so it
       sits at the same size as other apps in the Dock and Finder. Rendered
       to deploy/mac/AppIcon-1024.png, which build_app.sh makes the .icns
       from. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36a3de"/>
      <stop offset="1" stop-color="#2088c4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <g fill="#fff" transform="translate(100 100) scale(1.7167) translate(-16 -16)">
    <rect x="140" y="162" width="150" height="44" rx="22"/>
    <rect x="140" y="234" width="232" height="44" rx="22"/>
    <rect x="140" y="306" width="190" height="44" rx="22"/>
    <path d="M366 88 Q373 143 428 150 Q373 157 366 212 Q359 157 304 150 Q359 143 366 88 Z"/>
  </g>
</svg>
