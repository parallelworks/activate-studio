<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The macOS app's icon, on Apple's icon grid: an 824-pixel rounded
       square centered on a 1024 canvas, with a soft shadow below it, so it
       sits at the same size as other apps in the Dock and Finder. Rendered
       to deploy/mac/AppIcon-1024.png, which build_app.sh makes the .icns
       from. -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4f91"/><stop offset="1" stop-color="#0b1d36"/></linearGradient>
    <radialGradient id="hl" cx="0.25" cy="0.12" r="0.9"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9be7ff"/><stop offset="1" stop-color="#4cc3ff"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#hl)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="3"/>
  <g transform="translate(100 100) scale(1.7167) translate(-16 -16)">
  <g fill="#ffffff">
    <rect x="140" y="164" width="150" height="40" rx="20"/>
    <rect x="140" y="236" width="232" height="40" rx="20"/>
    <rect x="140" y="308" width="190" height="40" rx="20" opacity="0.92"/>
  </g>
  <path d="M366 86 Q372 143 430 150 Q372 157 366 214 Q360 157 302 150 Q360 143 366 86 Z" fill="url(#sp)"/></g>
</svg>
